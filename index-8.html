<title>k.n24network</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════
   ROOT VARIABLES
═══════════════════════════════ */
:root {
  --bg:       #03060f;
  --bg1:      #060b18;
  --bg2:      #0a1020;
  --bg3:      #0d1428;
  --card:     #090e1c;
  --card2:    #0c1224;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.13);
  --text:     #e8eeff;
  --text2:    #7a8aaa;
  --text3:    #3a4a6a;
  --blue:     #3b7dff;
  --blue2:    #6fa3ff;
  --cyan:     #00e5cc;
  --green:    #00c896;
  --orange:   #ff7a30;
  --red:      #ff3d5a;
  --purple:   #8b5cf6;
  --gold:     #f5c842;
  --r:        20px;
  --r2:       16px;
  --r3:       12px;
}

/* ═══════════════════════════════
   BASE
═══════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans Bengali',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
input,select,button,textarea{font-family:'Noto Sans Bengali',sans-serif}
input:focus,select:focus,textarea:focus{outline:none}
a{text-decoration:none}
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px}
select option{background:var(--bg2)}

/* ═══════════════════════════════
   SPLASH
═══════════════════════════════ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
}
.splash-ring{
  position:relative;width:110px;height:110px;margin-bottom:28px;
}
.splash-ring::before{
  content:'';position:absolute;inset:-3px;border-radius:34px;
  background:conic-gradient(var(--blue),var(--cyan),var(--blue));
  animation:spin 1.5s linear infinite;
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff 0);
}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-logo{
  position:absolute;inset:3px;border-radius:32px;
  background:linear-gradient(145deg,#0b1535,#1a3a7e);
  display:flex;align-items:center;justify-content:center;
  font-size:46px;
  box-shadow:0 0 50px rgba(59,125,255,0.3);
}
.splash-name{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:900;font-size:32px;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--blue2),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:6px;
}
.splash-sub{font-size:11px;color:var(--text3);letter-spacing:4px;text-transform:uppercase;margin-bottom:36px}
.splash-dots{display:flex;gap:10px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:sdot 1.5s ease infinite}
.sdot:nth-child(2){animation-delay:.25s;background:var(--cyan)}
.sdot:nth-child(3){animation-delay:.5s;background:var(--blue2)}
@keyframes sdot{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}

/* ═══════════════════════════════
   LOCK SCREEN
═══════════════════════════════ */
#lock-screen{
  position:fixed;inset:0;z-index:8000;background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 24px;
}
.lock-glow{
  width:80px;height:80px;border-radius:26px;
  background:linear-gradient(145deg,#0b1535,#1a3a7e);
  display:flex;align-items:center;justify-content:center;font-size:38px;
  box-shadow:0 0 0 12px rgba(59,125,255,0.07),0 0 60px rgba(59,125,255,0.25);
  margin-bottom:22px;
}
#lock-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:26px;font-weight:800;margin-bottom:6px;text-align:center}
#lock-sub{font-size:13px;color:var(--text3);margin-bottom:38px;text-align:center}
.pin-dots{display:flex;gap:18px;margin-bottom:40px}
.pin-dot{
  width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.1);
  transition:.2s cubic-bezier(.34,1.56,.64,1);
}
.pin-dot.on{background:var(--blue);border-color:var(--blue);box-shadow:0 0 20px rgba(59,125,255,0.6);transform:scale(1.15)}
.pin-dot.err{background:var(--red)!important;border-color:var(--red)!important}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:290px}
.pkey{
  height:72px;border-radius:22px;
  background:var(--card2);border:1px solid var(--border);
  color:var(--text);font-size:26px;font-weight:800;
  cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:all .1s;
}
.pkey:active{transform:scale(.88);background:rgba(59,125,255,0.2);border-color:rgba(59,125,255,0.5);box-shadow:0 0 24px rgba(59,125,255,0.25)}
.pkey-sub{font-size:8px;color:var(--text3);letter-spacing:1.5px;font-family:'Noto Sans Bengali',sans-serif}
#mode-toggle{margin-top:24px;display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:14px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;color:var(--text2);font-weight:600}

/* ═══════════════════════════════
   APP SHELL
═══════════════════════════════ */
#app{display:none;flex-direction:column;min-height:100dvh}
#app.on{display:flex}

/* HEADER */
#hdr{
  position:sticky;top:0;z-index:100;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  background:rgba(3,6,15,0.93);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-bottom:1px solid var(--border);
  width:100%;
}
.hdr-in{display:flex;align-items:center;justify-content:space-between}
.hdr-logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.hdr-icon{
  width:40px;height:40px;border-radius:13px;
  background:linear-gradient(145deg,#0b1535,#1a3a7e);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 0 22px rgba(59,125,255,0.3);
}
.hdr-brand{font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:20px;letter-spacing:-.5px}
.hdr-brand em{font-style:normal;color:var(--blue2)}
.hdr-right{display:flex;align-items:center;gap:8px}
.mode-chip{
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:10px;
  background:var(--card);border:1px solid var(--border);
  font-size:11px;font-weight:700;color:var(--text2);
}
.mode-led{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.hdr-btn{
  width:38px;height:38px;border-radius:12px;
  background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;cursor:pointer;color:var(--text2);transition:.12s;
}
.hdr-btn:active{transform:scale(.9);background:rgba(59,125,255,0.15)}

/* BOTTOM NAV */
#nav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(4,7,18,0.97);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border-top:1px solid var(--border);
  display:flex;align-items:flex-end;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
.ni{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:4px;padding:6px 2px;border-radius:16px;
  cursor:pointer;border:none;background:transparent;transition:.15s;
  position:relative;
}
.ni-icon{font-size:22px;line-height:1;opacity:.3;transition:.15s;filter:grayscale(.9)}
.ni-label{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.1px;transition:.15s}
.ni.on{background:rgba(59,125,255,0.1)}
.ni.on .ni-icon{opacity:1;filter:none;filter:drop-shadow(0 0 8px rgba(59,125,255,0.7))}
.ni.on .ni-label{color:var(--blue2)}
.ni-badge{
  position:absolute;top:2px;right:calc(50% - 18px);
  background:var(--red);color:#fff;border-radius:50%;
  width:17px;height:17px;font-size:9px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--bg);
}

/* PAGE */
#page{flex:1;padding:16px 14px;padding-bottom:calc(90px + env(safe-area-inset-bottom));animation:pgIn .2s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* TOAST */
#toast{
  position:fixed;top:12px;left:12px;right:12px;z-index:9999;
  padding:14px 18px;border-radius:18px;font-weight:700;font-size:14px;
  display:none;box-shadow:0 12px 50px rgba(0,0,0,0.8);
  backdrop-filter:blur(12px);color:#fff;
  animation:toIn .28s cubic-bezier(.34,1.3,.64,1);
}
@keyframes toIn{from{opacity:0;transform:translateY(-16px)scale(.94)}to{opacity:1;transform:none}}

/* ═══════════════════════════════
   COMPONENTS
═══════════════════════════════ */

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.cp{padding:16px}

/* SECTION TITLE */
.stitle{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;font-size:15px;color:var(--text);
  display:flex;align-items:center;gap:8px;margin-bottom:14px;
}

/* STAT GRID */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.scard{
  border-radius:var(--r);padding:16px;position:relative;overflow:hidden;border:1px solid transparent;
}
.scard::after{content:'';position:absolute;inset:0;border-radius:var(--r);border:1px solid rgba(255,255,255,0.06);pointer-events:none}
.scard-glow{position:absolute;width:90px;height:90px;border-radius:50%;top:-25px;right:-15px;filter:blur(28px);opacity:.18}
.scard-lbl{font-size:9.5px;color:var(--text2);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;position:relative}
.scard-val{font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:26px;letter-spacing:-1px;line-height:1;position:relative}
.scard-sub{font-size:11px;color:var(--text3);margin-top:6px;position:relative}
.sbar{height:3px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;margin-top:12px;position:relative}
.sbar-f{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.34,1,.64,1)}

/* QUICK ACTION BUTTONS */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{
  border:none;border-radius:var(--r2);padding:16px 10px;
  cursor:pointer;font-size:12px;font-weight:700;color:#fff;
  font-family:'Noto Sans Bengali',sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:.14s;position:relative;
}
.qbtn:active{transform:scale(.94);filter:brightness(.85)}
.qico{font-size:28px}

/* BUTTONS */
.btn{
  border:none;border-radius:var(--r2);padding:14px 16px;
  cursor:pointer;font-size:14px;font-weight:700;
  color:#fff;font-family:'Noto Sans Bengali',sans-serif;
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .13s;
}
.btn:active{transform:scale(.96);filter:brightness(.85)}
.btn-blue{background:linear-gradient(135deg,#0d2560,var(--blue));box-shadow:0 5px 24px rgba(59,125,255,0.28)}
.btn-cyan{background:linear-gradient(135deg,#004a42,var(--cyan));box-shadow:0 5px 24px rgba(0,229,204,0.2)}
.btn-green{background:linear-gradient(135deg,#003d2a,var(--green));box-shadow:0 5px 24px rgba(0,200,150,0.2)}
.btn-orange{background:linear-gradient(135deg,#5a2800,var(--orange));box-shadow:0 5px 24px rgba(255,122,48,0.22)}
.btn-red{background:linear-gradient(135deg,#600010,var(--red));box-shadow:0 5px 24px rgba(255,61,90,0.22)}
.btn-purple{background:linear-gradient(135deg,#2d1a60,var(--purple));box-shadow:0 5px 24px rgba(139,92,246,0.22)}
.btn-ghost{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text2)}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:var(--r3);width:auto}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* INPUTS */
.inp{
  width:100%;
  background:rgba(255,255,255,0.04);border:1.5px solid var(--border);
  border-radius:var(--r2);padding:13px 14px;
  color:var(--text);font-size:15px;
  transition:.15s;
}
.inp:focus{border-color:var(--blue);background:rgba(59,125,255,0.05);box-shadow:0 0 0 3px rgba(59,125,255,0.1)}
.lbl{font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px;display:block}
.field{margin-bottom:14px}
textarea.inp{resize:none;line-height:1.7}

/* SHEET */
.sh-ov{
  position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:500;
  display:flex;align-items:flex-end;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.sh-box{
  background:#070c1e;border-radius:28px 28px 0 0;
  border-top:1px solid rgba(255,255,255,0.1);
  width:100%;max-height:94dvh;overflow-y:auto;
  padding:20px 16px calc(28px + env(safe-area-inset-bottom));
  animation:shUp .26s cubic-bezier(.34,1.08,.64,1);
}
@keyframes shUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh-knob{width:38px;height:4px;background:rgba(255,255,255,0.14);border-radius:4px;margin:0 auto 20px}
.sh-title{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;margin-bottom:18px}

/* TAGS */
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap}

/* AVATAR */
.av{border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

/* DIVIDER */
.dvd{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent);margin:14px 0}

/* ROWS */
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,0.04);transition:background .1s;cursor:pointer}
.row:last-child{border-bottom:none}
.row:active{background:rgba(255,255,255,0.02)}

/* FOLDER CARDS */
.fcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;transition:border-color .2s}
.fcard.op{border-color:rgba(59,125,255,0.3)}
.fcard-hdr{display:flex;align-items:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.fc-arrow{padding:0 16px;font-size:13px;color:var(--blue);opacity:.45;transition:.2s}
.fcard.op .fc-arrow{transform:rotate(180deg);opacity:1}
.fcard-body{display:none;border-top:1px solid rgba(255,255,255,0.05)}
.fcard.op .fcard-body{display:block}

/* INFO BOX */
.ibox{background:rgba(59,125,255,0.06);border:1px solid rgba(59,125,255,0.15);border-radius:var(--r3);padding:13px 15px;font-size:12px;color:var(--blue2);line-height:1.9;margin-bottom:12px}

/* PROGRESS */
.prog{height:4px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden}
.prog-f{height:100%;border-radius:4px}

/* SUMMARY ROW */
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sumbox{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r3);padding:12px;text-align:center}
.sumval{font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:20px;letter-spacing:-.5px}
.sumlbl{font-size:10px;color:var(--text3);margin-top:3px;font-weight:700}

/* FAB */
.fab{
  position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));right:16px;
  width:58px;height:58px;border-radius:20px;z-index:50;
  background:linear-gradient(135deg,#0d2560,var(--blue));
  border:none;color:#fff;font-size:30px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 36px rgba(59,125,255,0.5);transition:.18s;
}
.fab:active{transform:scale(.9)}

/* ADDR DROPDOWN */
.adrop{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:99;background:#0a1228;border:1.5px solid rgba(59,125,255,0.35);border-radius:var(--r2);max-height:170px;overflow-y:auto;box-shadow:0 16px 50px rgba(0,0,0,.7)}
.adrop-item{padding:12px 16px;cursor:pointer;font-size:14px;color:var(--text2);border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;gap:8px;transition:background .1s}
.adrop-item:active{background:rgba(59,125,255,0.12);color:var(--text)}
.adrop-item:last-child{border-bottom:none}

/* ═══════════════════════════════
   PAGE-SPECIFIC
═══════════════════════════════ */
.bill-row{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,0.04)}
.bill-row:last-child{border-bottom:none}
.bill-row:active{background:rgba(255,255,255,0.02)}

.sms-bubble{background:rgba(59,125,255,0.05);border:1px solid rgba(59,125,255,0.1);border-radius:14px 14px 14px 3px;padding:10px 13px;font-size:12px;color:var(--text2);line-height:1.9}

/* PAYMENT CARD */
.pay-hero{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r2);padding:18px;margin-bottom:16px;
}

/* ═══════════════════════════════
   DESKTOP / CHROME RESPONSIVE
═══════════════════════════════ */
@media (min-width: 600px){
  body { background: #01030a; }

  /* Center app in desktop */
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    position: relative;
    box-shadow: 0 0 80px rgba(59,125,255,.15);
    border-left: 1px solid rgba(255,255,255,.05);
    border-right: 1px solid rgba(255,255,255,.05);
  }

  /* Lock screen center */
  #lock-screen {
    max-width: 480px;
    left: 50%;
    transform: translateX(-50%);
    right: auto;
    width: 480px;
  }

  /* Install bar center */
  #install-bar {
    max-width: 480px;
    left: 50%;
    transform: translateX(-50%);
    right: auto;
    width: 480px;
    border-radius: 0;
  }

  /* Sheet overlay full screen but box centered */
  .sh-box {
    max-width: 480px;
    margin: 0 auto;
    border-radius: 28px 28px 0 0;
  }

  /* Nav fixed to app width */
  #nav {
    max-width: 480px;
    left: 50%;
    transform: translateX(-50%);
    right: auto;
    border-radius: 0;
    border-left: 1px solid rgba(255,255,255,.05);
    border-right: 1px solid rgba(255,255,255,.05);
  }

  /* Header */
  #hdr {
    max-width: 480px;
    left: 50%;
    transform: translateX(-50%);
    right: auto;
    border-left: 1px solid rgba(255,255,255,.05);
    border-right: 1px solid rgba(255,255,255,.05);
  }

  /* FAB */
  .fab {
    right: calc(50% - 224px);
  }

  /* Desktop sidebar hint */
  body::before {
    content: '';
    position: fixed;
    inset: 0;

<script>
// ═══════════════════════════════════════════════════
//  DATA LAYER — ডেটা হারানো থেকে সুরক্ষা
// ═══════════════════════════════════════════════════
function ld(k,fb){try{const d=localStorage.getItem(k);return d?JSON.parse(d):fb}catch{return fb}}
function sv(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}
  try{
    const slot='nb_bk_'+((Date.now()/60000|0)%5);
    localStorage.setItem(slot,JSON.stringify({customers,bills,smsLog,company,at:Date.now()}));
  }catch(e){}
  // Auto cloud sync
  if(_jbKey) clearTimeout(window._jbT), window._jbT=setTimeout(jbSave, 2000);
}

let customers=ld('nb3_c',[]);
let bills=ld('nb3_b',[]);
let smsLog=ld('nb3_s',[]);
let company=ld('nb3_co',{name:'k.n24network Telecom',phone:'01700-000000',address:'ঢাকা'});

const AVC=['#3b7dff','#00c896','#ff7a30','#8b5cf6','#00e5cc','#ff3d5a','#f5c842','#6fa3ff'];
function av(name,id){return{bg:AVC[Math.abs((id||0)*7)%AVC.length],lt:(name||'?')[0].toUpperCase()}}
function fmt(n){return Number(n||0).toLocaleString('bn-BD')}
function mKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)}
function mLabel(){
  const d=new Date();
  const m=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  const yr=String(d.getFullYear()).replace(/./g,x=>'০১২৩৪৫৬৭৮৯'[x]);
  return yr+' '+m[d.getMonth()];
}
function price(c){return c.customPrice||0}

// ═══ FIREBASE (removed - using JSONBin) ═══
var _fa=null,_fd=null,_sc='',_fc=null;
function fbInit(){}
function fbRef(){return null;}
function fbPull(){}
function fbPush(){}

// ═══ AUTO BILLS ═══
function autoBills(){
  const mk=mKey(),ml=mLabel();let ch=false;
  customers.filter(c=>c.status==='active').forEach(c=>{
    if(!bills.find(b=>b.customerId===c.id&&b.monthKey===mk)){
      bills.push({id:Date.now()+Math.random(),customerId:c.id,customerName:c.name,phone:c.phone,month:ml,monthKey:mk,amount:price(c),paid:0,due:price(c),status:'unpaid'});
      ch=true;
    }
  });
  if(ch)sv('nb3_b',bills);
}

// ═══════════════════════════════════════════════════
//  PIN / LOCK
// ═══════════════════════════════════════════════════
let _mode='admin',_pb='',_pt='admin';
function aPin(){return ld('nb3_apin','1234')}
function cPin(){return ld('nb3_cpin','0000')}

function checkLock(){
  if(aPin()!=='0000'){showLock('admin');}else{unlock();}
}
function showLock(target){
  _pt=target;_pb='';updDots();
  document.getElementById('lock-screen').style.display='flex';
  document.getElementById('lock-title').textContent=target==='admin'?'অ্যাডমিন পিন':'ক্যাশিয়ার পিন';
  document.getElementById('lock-sub').textContent='পিন দিয়ে প্রবেশ করুন';
  document.getElementById('kp-mode').innerHTML=target==='admin'?'👤<br/><span style="font-size:9px">ক্যাশিয়ার</span>':'🔑<br/><span style="font-size:9px">অ্যাডমিন</span>';
}
function unlock(){
  document.getElementById('lock-screen').style.display='none';
  document.getElementById('app').classList.add('on');
  _mode=_pt;applyMode();autoBills();render();
  try{if(_jbKey&&_jbBin){jbLoad();updSyncChip(true);}}catch(e){}
}
function lockApp(){document.getElementById('app').classList.remove('on');checkLock();}
function kp(v){
  if(v==='mode'){_pt=_pt==='admin'?'cashier':'admin';_pb='';updDots();showLock(_pt);return;}
  if(v==='del'){_pb=_pb.slice(0,-1);updDots();return;}
  if(_pb.length>=4)return;
  _pb+=v;updDots();
  if(_pb.length===4){
    setTimeout(()=>{
      const ok=_pt==='admin'?aPin():cPin();
      if(_pb===ok){unlock();}
      else{
        document.querySelectorAll('.pin-dot').forEach(d=>d.classList.add('err'));
        setTimeout(()=>{document.querySelectorAll('.pin-dot').forEach(d=>{d.classList.remove('err','on')});_pb='';},700);
        toast('⚠️ ভুল পিন!',true);
      }
    },100);
  }
}
function updDots(){
  for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d){d.classList.toggle('on',i<_pb.length);d.classList.remove('err');}}
}
function applyMode(){
  const a=_mode==='admin';
  document.getElementById('mode-lbl').textContent=a?'Admin':'Cashier';
  const led=document.getElementById('mode-led');
  if(led){led.style.background=a?'var(--green)':'var(--orange)';led.style.boxShadow=a?'0 0 8px var(--green)':'0 0 8px var(--orange)';}
}

// ═══════════════════════════════════════════════════
//  ROUTING
// ═══════════════════════════════════════════════════
let _pg='dash';
function go(p){
  _pg=p;
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('on'));
  const nb=document.getElementById('ni-'+p);if(nb)nb.classList.add('on');
  render();closeSheet();
}
function render(){
  const el=document.getElementById('page');if(!el)return;
  const map={dash:rDash,cust:rCust,bills:rBills,pay:rPay,sms:rSMS,cfg:rCfg};
  if(map[_pg])el.innerHTML=map[_pg]();
}

// ═══════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════
let _tt;
function toast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  t.style.background=err?'rgba(255,61,90,.92)':'rgba(0,200,150,.92)';
  clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',3000);
}
function showSheet(html){
  closeSheet();
  const ov=document.createElement('div');
  ov.className='sh-ov';ov.id='ov';
  ov.innerHTML='<div class="sh-box">'+html+'</div>';
  ov.addEventListener('click',e=>{if(e.target.classList.contains('sh-ov'))closeSheet();});
  document.body.appendChild(ov);
}
function closeSheet(){const ov=document.getElementById('ov');if(ov)ov.remove();}
function empty(ico,txt){
  return `<div style="text-align:center;padding:52px 20px;color:var(--text3)"><div style="font-size:48px;margin-bottom:12px;opacity:.35">${ico}</div><div style="font-size:14px;font-weight:600">${txt}</div></div>`;
}

// ═══════════════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════════════
function expiryList(){
  const mk=mKey();
  return customers.filter(c=>c.status==='active'&&bills.some(b=>b.customerId===c.id&&b.monthKey===mk&&b.status!=='paid'));
}
function rDash(){
  // ── গ্রাহক পরিসংখ্যান ──
  const act   = customers.filter(c=>c.status==='active').length;
  const inact = customers.length - act;

  // বর্তমান মাসের বিল অনুযায়ী গ্রাহক শ্রেণী
  const mk = mKey();
  let cPaid=0, cPartial=0, cDue=0, cAdv=0;
  customers.forEach(c=>{
    const cbs = bills.filter(b=>b.customerId===c.id);
    const curBill = cbs.find(b=>b.monthKey===mk);
    if(!curBill) return;
    if(curBill.status==='paid'){
      // অগ্রিম: পরিশোধ করেছে কিন্তু amount এর চেয়ে বেশি দিয়েছে
      if(curBill.paid > curBill.amount) cAdv++;
      else cPaid++;
    } else if(curBill.status==='partial') cPartial++;
    else cDue++;
  });

  // বকেয়া ও সংগ্রহ
  const tDue  = bills.reduce((s,b)=>s+b.due,0);
  const tPaid = bills.reduce((s,b)=>s+b.paid,0);
  const unp   = bills.filter(b=>b.status!=='paid').length;
  const alc   = expiryList().length;

  // আজকের সংগ্রহ
  const tod = new Date().toDateString();
  const todPaid = smsLog.filter(l=>l.type==='payment'&&new Date(l.time||0).toDateString()===tod)
                        .reduce((s,l)=>s+(l.amount||0),0);

  const pct=(n,t)=>t?Math.min(100,Math.round(n/t*100)):0;

  // শীর্ষ বকেয়া গ্রাহক
  const topDue = [...customers].filter(c=>bills.some(b=>b.customerId===c.id&&b.due>0))
    .sort((a,b)=>{
      const da=bills.filter(x=>x.customerId===a.id).reduce((s,x)=>s+x.due,0);
      const db=bills.filter(x=>x.customerId===b.id).reduce((s,x)=>s+x.due,0);
      return db-da;
    }).slice(0,6);

  let dueRows='';
  topDue.forEach(c=>{
    const due=bills.filter(b=>b.customerId===c.id).reduce((s,b)=>s+b.due,0);
    const a=av(c.name,c.id);
    const cb=bills.find(b=>b.customerId===c.id&&b.status!=='paid');
    dueRows+=`<div class="row" onclick="sendDueSMS(${c.id})">
      <div class="av" style="width:46px;height:46px;background:${a.bg}18;color:${a.bg};font-size:18px;font-weight:800;flex-shrink:0">
        ${c.photo?`<img src="${c.photo}"/>`:`<span>${a.lt}</span>`}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:800;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${c.name}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${c.phone}</div>
      </div>
      <div style="flex-shrink:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px">
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:15px;color:var(--orange)">৳${fmt(due)}</div>
        <div style="display:flex;gap:5px">
          <button onclick="event.stopPropagation();sendDueSMS(${c.id})" style="background:rgba(255,122,48,.14);border:1px solid rgba(255,122,48,.28);color:var(--orange);border-radius:7px;padding:3px 9px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit">⚠️ SMS</button>
          ${cb?`<button onclick="event.stopPropagation();payModal(${cb.id})" style="background:rgba(0,200,150,.14);border:1px solid rgba(0,200,150,.28);color:var(--cyan);border-radius:7px;padding:3px 9px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit">💳 পে</button>`:''}
        </div>
      </div>
    </div>`;
  });

  const total = customers.length;
  const ring = (val,tot,color)=>{
    const p = pct(val,tot);
    const dash = 2*Math.PI*28;
    const off = dash - (dash*p/100);
    return `<circle cx="32" cy="32" r="28" fill="none" stroke="${color}" stroke-width="4" stroke-dasharray="${dash.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 32 32)" style="transition:stroke-dashoffset .8s ease"/>`;
  };

  return `<div>
  <!-- ══ মোট সারাংশ কার্ড ══ -->
  <div style="background:linear-gradient(145deg,#050f2a,#071535);border:1px solid rgba(59,125,255,.18);border-radius:var(--r);padding:18px;margin-bottom:10px;position:relative;overflow:hidden">
    <div style="position:absolute;width:200px;height:200px;border-radius:50%;top:-60px;right:-60px;background:var(--blue);opacity:.06;filter:blur(30px);pointer-events:none"></div>
    <div style="font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px">📊 এই মাসের সারসংক্ষেপ — ${mLabel()}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:14px">
      <div style="padding:13px 10px;text-align:center;border-right:1px solid var(--border)">
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:24px;color:var(--blue2)">${total}</div>
        <div style="font-size:10px;color:var(--text3);font-weight:700;margin-top:3px">মোট গ্রাহক</div>
      </div>
      <div style="padding:13px 10px;text-align:center;border-right:1px solid var(--border)">
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:24px;color:var(--green)">${act}</div>
        <div style="font-size:10px;color:var(--text3);font-weight:700;margin-top:3px">সক্রিয়</div>
      </div>
      <div style="padding:13px 10px;text-align:center">
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:24px;color:#ff7a88">${inact}</div>
        <div style="font-size:10px;color:var(--text3);font-weight:700;margin-top:3px">বিচ্ছিন্ন</div>
      </div>
    </div>
    <!-- রঙিন গ্রাহক শ্রেণী -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
      ${[
        {lbl:'বকেয়া গ্রাহক',val:cDue,co:'var(--orange)',ico:'⏳',bg:'rgba(255,122,48,.1)',border:'rgba(255,122,48,.2)',fn:`openCustByStatus('due')`},
        {lbl:'আংশিক পরিশোধ',val:cPartial,co:'var(--gold)',ico:'⚡',bg:'rgba(245,200,66,.1)',border:'rgba(245,200,66,.2)',fn:`openCustByStatus('partial')`},
        {lbl:'পরিশোধ সম্পন্ন',val:cPaid,co:'var(--green)',ico:'✅',bg:'rgba(0,200,150,.1)',border:'rgba(0,200,150,.2)',fn:`openCustByStatus('paid')`},
        {lbl:'অগ্রিম পরিশোধ',val:cAdv,co:'var(--purple)',ico:'🌟',bg:'rgba(139,92,246,.1)',border:'rgba(139,92,246,.2)',fn:`openCustByStatus('advance')`},
      ].map(x=>`<button onclick="${x.fn}" style="background:${x.bg};border:1px solid ${x.border};border-radius:var(--r3);padding:12px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:inherit;text-align:left;transition:.13s">
        <div style="font-size:22px;flex-shrink:0">${x.ico}</div>
        <div>
          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:20px;color:${x.co};line-height:1">${x.val}</div>
          <div style="font-size:10px;color:var(--text3);font-weight:700;margin-top:3px;line-height:1.3">${x.lbl}</div>
        </div>
      </button>`).join('')}
    </div>

function openCustByStatus(type){
  let list=[];
  const mk=mKey();
  if(type==='due'){
    list=customers.filter(c=>{
      const b=bills.find(x=>x.customerId===c.id&&x.monthKey===mk);
      return b&&b.status==='unpaid';
    });
  } else if(type==='partial'){
    list=customers.filter(c=>{
      const b=bills.find(x=>x.customerId===c.id&&x.monthKey===mk);
      return b&&b.status==='partial';
    });
  } else if(type==='paid'){
    list=customers.filter(c=>{
      const b=bills.find(x=>x.customerId===c.id&&x.monthKey===mk);
      return b&&b.status==='paid'&&b.paid<=b.amount;
    });
  } else if(type==='advance'){
    list=customers.filter(c=>{
      const b=bills.find(x=>x.customerId===c.id&&x.monthKey===mk);
      return b&&b.status==='paid'&&b.paid>b.amount;
    });
  }

  const titles={due:'⏳ বকেয়া গ্রাহক',partial:'⚡ আংশিক পরিশোধ',paid:'✅ পরিশোধ সম্পন্ন',advance:'🌟 অগ্রিম পরিশোধ'};
  const colors={due:'var(--orange)',partial:'var(--gold)',paid:'var(--green)',advance:'var(--purple)'};

  let rows='';
  list.forEach(c=>{
    const a=av(c.name,c.id);
    const b=bills.find(x=>x.customerId===c.id&&x.monthKey===mk);
    const due=bills.filter(x=>x.customerId===c.id).reduce((s,x)=>s+x.due,0);
    rows+=`<div style="display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.04)">
      <div class="av" style="width:44px;height:44px;background:${a.bg}18;color:${a.bg};font-size:17px;font-weight:800;flex-shrink:0">
        ${c.photo?`<img src="${c.photo}"/>`:`<span>${a.lt}</span>`}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:800;font-size:14px">${c.name}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${c.phone}</div>
      </div>
      <div style="flex-shrink:0;text-align:right">
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:14px;color:${colors[type]}">৳${fmt(b?b.amount:0)}</div>
        ${due>0?`<button onclick="closeSheet();sendDueSMS(${c.id})" style="margin-top:4px;background:rgba(255,122,48,.14);border:1px solid rgba(255,122,48,.28);color:var(--orange);border-radius:7px;padding:3px 10px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit">SMS ↗</button>`:''}
      </div>
    </div>`;
  });

  showSheet(`<div>
    <div class="sh-knob"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <div style="width:48px;height:48px;border-radius:16px;background:${colors[type]}18;border:1px solid ${colors[type]}28;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">${titles[type].split(' ')[0]}</div>
      <div>
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:17px">${titles[type]}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px">${list.length} জন গ্রাহক</div>
      </div>
    </div>
    ${list.length?`<div class="card" style="margin-bottom:14px">${rows}</div>`:`<div style="padding:30px;text-align:center;color:var(--text3)">কোনো গ্রাহক নেই</div>`}
    ${type==='due'||type==='partial'?`<button class="btn btn-orange" style="margin-bottom:10px" onclick="closeSheet();bulkDueSMS()">📢 সবাইকে বকেয়া SMS</button>`:''}
    <button class="btn btn-ghost" onclick="closeSheet()">বন্ধ করুন</button>
  </div>`);
}

  showSheet(`<div>

function bulkAreaSMS(area){
  const ac=customers.filter(c=>(c.address||'').toLowerCase().includes(area.toLowerCase())&&c.status==='active');
  const dueList=ac.filter(c=>bills.some(b=>b.customerId===c.id&&b.due>0));
  if(!dueList.length){toast('✅ এই এলাকায় কোনো বকেয়া নেই!');return;}
  let idx=0;
  function nxt(){
    if(idx>=dueList.length){toast('✅ সব SMS পাঠানো হয়েছে!');closeSheet();return;}
    const cx=dueList[idx];
    const due=bills.filter(b=>b.customerId===cx.id).reduce((s,b)=>s+b.due,0);
    const msg='সম্মানিত '+cx.name+', আপনার মোট বকেয়া বিল ৳'+fmt(due)+' টাকা। দ্রুত পরিশোধ করুন, না হলে সংযোগ বিচ্ছিন্ন হতে পারে। — '+company.name+', '+company.phone;
    const href='sms:'+cx.phone.replace(/[^0-9+]/g,'')+'?body='+encodeURIComponent(msg);
    const pct=Math.round((idx+1)/dueList.length*100);
    showSheet(`<div>
      <div class="sh-knob"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px">📍 ${area} — বকেয়া SMS</div>
        <span style="background:rgba(255,122,48,.15);color:var(--orange);border-radius:8px;padding:4px 11px;font-size:12px;font-weight:700">${idx+1}/${dueList.length}</span>
      </div>
      <div style="height:4px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;margin-bottom:14px">
        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--orange),var(--red));border-radius:4px;transition:width .3s"></div>
      </div>
      <div style="background:rgba(255,122,48,.07);border:1px solid rgba(255,122,48,.15);border-radius:14px;padding:14px;margin-bottom:12px">
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:16px">${cx.name}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:3px">📞 ${cx.phone}</div>
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:24px;color:var(--orange);margin-top:8px;letter-spacing:-.5px">৳${fmt(due)}</div>
      </div>
      <button class="btn btn-orange" style="margin-bottom:9px" onclick="window.location.href='${href}';setTimeout(()=>{idx++;nxt();},1200)">📱 SMS পাঠান → পরের জন</button>
      <button onclick="idx++;nxt()" class="btn btn-ghost" style="margin-bottom:8px">⏭️ এড়িয়ে যান</button>
      <button onclick="closeSheet()" class="btn btn-ghost">বন্ধ করুন</button>
    </div>`);
  }
  nxt();
}


function cFilter(st,area,q){
  window._cSt=st||'all';
  window._cArea=area||'';
  if(q!==undefined) window._cQ=q||'';
  window._fo={};
  render();
  setTimeout(()=>document.getElementById('page')?.scrollTo({top:0,behavior:'smooth'}),50);
}

function cTog(key){
  if(!window._fo) window._fo={};
  window._fo[key]=!window._fo[key];
  const fc=document.getElementById('fc-'+key);
  const fb=document.getElementById('fb-'+key);
  if(!fc||!fb) return;
  const open=!!window._fo[key];
  fc.style.borderColor=open?'rgba(59,125,255,.35)':'var(--border)';
  fb.style.display=open?'block':'none';
  // আর্যো রোটেশন
  const arr=fc.querySelector('div[style*="rotate"]');
  if(arr){arr.style.transform=`rotate(${open?180:0}deg)`;arr.style.opacity=open?1:.35;}
}

function openQSMS(id){
  // গ্রাহক খুঁজি
  var cx=null;
  for(var i=0;i<customers.length;i++){
    if(customers[i].id==id){cx=customers[i];break;}
  }
  if(!cx){toast('গ্রাহক পাওয়া যায়নি',true);return;}

  var due=0;
  for(var j=0;j<bills.length;j++){
    if(bills[j].customerId==id) due+=bills[j].due;
  }

  // পুরনো sheet সরাই
  closeSheet();

  // Overlay তৈরি
  var ov=document.createElement('div');
  ov.className='sh-ov'; ov.id='ov';
  ov.addEventListener('click',function(e){if(e.target===ov)closeSheet();});

  // Sheet box
  var box=document.createElement('div');
  box.className='sh-box';

  // Knob
  var knob=document.createElement('div');
  knob.className='sh-knob';
  box.appendChild(knob);

  // Avatar row
  var row=document.createElement('div');
  row.style.cssText='display:flex;align-items:center;gap:13px;padding:4px 0 20px';
  var a=av(cx.name,cx.id);
  var avEl=document.createElement('div');
  avEl.style.cssText='width:52px;height:52px;border-radius:16px;background:'+a.bg+'18;color:'+a.bg+';display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;border:2px solid '+a.bg+'28';
  if(cx.photo){
    var img=document.createElement('img');
    img.src=cx.photo; img.style.cssText='width:52px;height:52px;object-fit:cover;border-radius:16px';
    avEl.appendChild(img);
  } else {
    var sp=document.createElement('span');
    sp.style.cssText='font-size:22px;font-weight:900';
    sp.textContent=a.lt;
    avEl.appendChild(sp);
  }
  var info=document.createElement('div');
  var nm=document.createElement('div');
  nm.style.cssText='font-size:17px;font-weight:800';
  nm.textContent=cx.name;
  var ph=document.createElement('div');
  ph.style.cssText='font-size:12px;color:var(--text3);margin-top:3px';
  ph.textContent=cx.phone;
  info.appendChild(nm); info.appendChild(ph);
  row.appendChild(avEl); row.appendChild(info);
  box.appendChild(row);

  // Buttons grid
  var grid=document.createElement('div');
  grid.style.cssText='display:grid;gap:9px';

  function mkBtn(cls,label,fn){
    var b=document.createElement('button');
    b.className=cls; b.textContent=label;
    b.addEventListener('click',fn);
    grid.appendChild(b);
  }

  if(due>0){
    mkBtn('btn btn-orange','⚠️ বকেয়া SMS — ৳'+fmt(due),function(){closeSheet();sendDueSMS(id);});
  }
  mkBtn('btn btn-cyan',  '🎉 স্বাগত বার্তা',      function(){closeSheet();doQSMS(id,'welcome');});
  mkBtn('btn btn-blue',  '🟢 সংযোগ চালু SMS',     function(){closeSheet();doQSMS(id,'reconnect');});
  mkBtn('btn btn-red',   '🔴 সংযোগ বন্ধ SMS',     function(){closeSheet();doQSMS(id,'disconnect');});
  mkBtn('btn btn-ghost', 'বাতিল',                  function(){closeSheet();});

  box.appendChild(grid);
  ov.appendChild(box);
  document.body.appendChild(ov);
}
function billSMS(billId){
  const b=bills.find(x=>x.id===billId);if(!b)return;
  const msg='সম্মানিত '+b.customerName+', আপনার '+b.month+' মাসের WiFi বিল ৳'+fmt(b.amount)+' টাকার মধ্যে ৳'+fmt(b.due)+' টাকা বকেয়া আছে। দ্রুত পরিশোধ করুন। — '+company.name+', '+company.phone;
  smsLog.unshift({id:Date.now(),type:'due',phone:b.phone,name:b.customerName,msg,time:new Date().toLocaleString('bn-BD')});
  sv('nb3_s',smsLog);
  smsSheet(b.phone,msg,'বিল SMS',b.customerName,0);
}

function rSMS(){
  const grp={};
  smsLog.forEach(l=>{const k=l.phone||'?';if(!grp[k])grp[k]={name:l.name,phone:l.phone,logs:[]};grp[k].logs.push(l);});
  let rows='';
  Object.values(grp).forEach(g=>{
    const a=av(g.name,g.phone);
    const cust=customers.find(c=>c.phone===g.phone);
    const tPaid=g.logs.filter(l=>l.type==='payment').reduce((s,l)=>s+(l.amount||0),0);
    const key='s'+(g.phone||'').replace(/\D/g,'');
    const open=!!(window._fo&&window._fo[key]);
    const hdr=`<div class="fcard-hdr" onclick="cTog('${key}')">
      <div style="display:flex;align-items:center;gap:12px;padding:12px 0 12px 14px;flex:1;min-width:0">
        <div class="av" style="width:46px;height:46px;font-size:18px;font-weight:900;background:${a.bg}15;color:${a.bg};flex-shrink:0">
          ${cust&&cust.photo?`<img src="${cust.photo}"/>`:`<span>${a.lt}</span>`}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:15px">${g.name}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap">
            <span>${g.phone}</span>
            <span class="tag" style="background:rgba(59,125,255,.1);color:var(--blue2);border:1px solid rgba(59,125,255,.15)">${g.logs.length}টি</span>
            ${tPaid?`<span class="tag" style="background:rgba(0,200,150,.1);color:var(--green);border:1px solid rgba(0,200,150,.15)">৳${fmt(tPaid)}</span>`:''}
          </div>
        </div>
        <a href="tel:${g.phone}" onclick="event.stopPropagation()" style="background:rgba(0,200,150,.1);border:1px solid rgba(0,200,150,.2);color:var(--green);border-radius:9px;padding:7px 10px;font-size:13px;text-decoration:none;margin-right:4px;flex-shrink:0">📞</a>
      </div>
      <div class="fc-arrow">▼</div>
    </div>`;
    const msgs=g.logs.map(l=>{
      const tc=l.type==='payment'?'var(--green)':l.type==='welcome'?'var(--blue2)':l.type==='disconnect'?'var(--red)':l.type==='reconnect'?'var(--cyan)':'var(--orange)';
      const tl=l.type==='payment'?'💳 পেমেন্ট':l.type==='welcome'?'🎉 স্বাগত':l.type==='disconnect'?'🔴 বন্ধ':l.type==='reconnect'?'🟢 চালু':'⚠️ বকেয়া';
      return `<div style="padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
          <span class="tag" style="background:${tc}15;color:${tc};border:1px solid ${tc}25">${tl}</span>
          ${l.amount?`<span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:15px;color:var(--green)">৳${fmt(l.amount)}</span>`:''}
        </div>
        <div class="sms-bubble">${l.msg}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:6px;text-align:right">${l.time}</div>
      </div>`;
    }).join('');
    rows+=`<div class="fcard${open?' op':''}" id="fc-${key}">
      ${hdr}
      <div class="fcard-body" id="fb-${key}" style="display:${open?'block':'none'}">${msgs}</div>
    </div>`;
  });
  return `<div>
    <div class="btn-row" style="margin-bottom:12px">
      <button class="btn btn-orange" onclick="bulkDueSMS()">📢 বাল্ক বকেয়া SMS</button>
      <button class="btn btn-blue" onclick="go('cust')">👥 গ্রাহক SMS</button>
    </div>
    <div id="slist">${rows||empty('💬','কোনো SMS নেই')}</div>
  </div>`;
}

function resizePhoto(inp,pvId,gv){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=200;canvas.height=200;
      const ctx=canvas.getContext('2d');
      const s=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,200,200);
      const b64=canvas.toDataURL('image/jpeg',.75);
      window[gv]=b64;
      const pv=document.getElementById(pvId);
      if(pv)pv.innerHTML=`<img src="${b64}" style="width:90px;height:90px;object-fit:cover;border-radius:22px"/>`;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function doPay(billId){

  b.paid+=amt;b.due=Math.max(0,b.due-amt);b.paidAt=new Date().toISOString();

function dlBackup(){
  const d={customers,bills,smsLog,company,at:new Date().toISOString(),v:'nb3'};
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download='k.n24network_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('✅ ব্যাকআপ ডাউনলোড হয়েছে!');
}
function waBackup(){dlBackup();setTimeout(()=>window.open('https://wa.me/?text=k.n24network+ব্যাকআপ+'+new Date().toLocaleDateString('en-GB'),'_blank'),700);}
function driveBackup(){dlBackup();setTimeout(()=>{window.open('https://drive.google.com','_blank');toast('Drive খুলুন → ফাইল আপলোড করুন');},700);}
function restoreFile(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=()=>{
    const file=inp.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const d=JSON.parse(e.target.result);
        if(d.customers){customers=d.customers;sv('nb3_c',customers);}
        if(d.bills){bills=d.bills;sv('nb3_b',bills);}
        if(d.smsLog){smsLog=d.smsLog;sv('nb3_s',smsLog);}
        if(d.company){company=d.company;sv('nb3_co',company);}
        render();toast('✅ ডেটা রিস্টোর হয়েছে!');fbPush();
      }catch(err){toast('⚠️ ফাইল সঠিক নয়!',true);}
    };
    reader.readAsText(file);
  };
  inp.click();
}

var _jbKey  = localStorage.getItem('nb3_jbkey')  || '';
var _jbBin  = localStorage.getItem('nb3_jbbin')  || '';
var _jbSync = false;

function jbSave(){
  if(!_jbKey) return;
  var data = {customers:customers, bills:bills, smsLog:smsLog, company:company, at:Date.now()};
  var url   = _jbBin
    ? 'https://api.jsonbin.io/v3/b/'+_jbBin
    : 'https://api.jsonbin.io/v3/b';
  var method = _jbBin ? 'PUT' : 'POST';
  fetch(url, {
    method: method,
    headers: {
      'Content-Type':'application/json',
      'X-Master-Key': _jbKey,
      'X-Bin-Name':   'k.n24network'
    },
    body: JSON.stringify(data)
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(!_jbBin && d.metadata && d.metadata.id){
      _jbBin = d.metadata.id;
      localStorage.setItem('nb3_jbbin', _jbBin);
    }
    updSyncChip(true);
    console.log('Sync OK');
  })
  .catch(function(e){console.log('Sync err',e);});
}

function jbLoad(){
  if(!_jbKey || !_jbBin) return;
  fetch('https://api.jsonbin.io/v3/b/'+_jbBin+'/latest', {
    headers: {'X-Master-Key': _jbKey}
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var rec = d.record;
    if(!rec) return;
    if(rec.customers) { customers=rec.customers; sv('nb3_c',customers); }
    if(rec.bills)     { bills=rec.bills;          sv('nb3_b',bills); }
    if(rec.smsLog)    { smsLog=rec.smsLog;         sv('nb3_s',smsLog); }
    if(rec.company)   { company=rec.company;        sv('nb3_co',company); }
    render();
    updSyncChip(true);
    toast('☁️ Sync সম্পন্ন!');
  })
  .catch(function(e){console.log('Load err',e);});
}

function updSyncChip(on){
  var ch=document.getElementById('sync-chip');
  if(ch) ch.style.display=on?'flex':'none';
}

function openCloud(){
  closeSheet();
  var ov=document.createElement('div');
  ov.className='sh-ov';ov.id='ov';
  ov.addEventListener('click',function(e){if(e.target===ov)closeSheet();});
  var box=document.createElement('div');box.className='sh-box';

  var knob=document.createElement('div');knob.className='sh-knob';box.appendChild(knob);

  // Icon + title
  var hdr=document.createElement('div');hdr.style.cssText='text-align:center;margin-bottom:20px';
  var ico=document.createElement('div');
  ico.style.cssText='width:68px;height:68px;border-radius:22px;background:linear-gradient(145deg,#003830,var(--cyan));display:inline-flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 0 30px rgba(0,229,204,.3);margin-bottom:12px';
  ico.textContent='☁️';
  var ttl=document.createElement('div');ttl.style.cssText='font-weight:900;font-size:20px';ttl.textContent='Cloud Sync';
  var sub=document.createElement('div');sub.style.cssText='font-size:12px;color:var(--text3);margin-top:4px';
  sub.textContent='সব ডিভাইসে একই ডেটা — সম্পূর্ণ বিনামূল্যে';
  hdr.appendChild(ico);hdr.appendChild(ttl);hdr.appendChild(sub);box.appendChild(hdr);

  // Status
  if(_jbKey && _jbBin){
    var st=document.createElement('div');
    st.style.cssText='background:rgba(0,200,150,.1);border:1px solid rgba(0,200,150,.25);border-radius:16px;padding:14px;margin-bottom:16px;display:flex;align-items:center;gap:12px';
    st.innerHTML='<div style="font-size:28px">✅</div><div>'+
      '<div style="font-weight:800;font-size:15px;color:var(--green)">সংযুক্ত আছে!</div>'+
      '<div style="font-size:11px;color:var(--text3);margin-top:3px">যেকোনো ডিভাইসে অ্যাপ খুলুন → API Key দিন → Sync করুন</div></div>';
    box.appendChild(st);
  } else {
    // Setup steps
    var guide=document.createElement('div');
    guide.style.cssText='background:rgba(59,125,255,.07);border:1px solid rgba(59,125,255,.18);border-radius:16px;padding:16px;margin-bottom:16px';
    var gtitle=document.createElement('div');gtitle.style.cssText='font-size:13px;font-weight:800;color:var(--blue2);margin-bottom:12px';
    gtitle.textContent='মাত্র ২ ধাপ:';
    var s1=document.createElement('div');s1.style.cssText='display:flex;align-items:flex-start;gap:12px;margin-bottom:12px';
    var s1n=document.createElement('div');s1n.style.cssText='width:28px;height:28px;border-radius:9px;background:rgba(59,125,255,.2);color:var(--blue2);font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px';s1n.textContent='১';
    var s1t=document.createElement('div');s1t.style.cssText='font-size:12px;color:var(--text2);line-height:1.8;padding-top:4px';
    var lnk=document.createElement('a');lnk.href='https://jsonbin.io';lnk.target='_blank';lnk.style.cssText='color:var(--blue2);font-weight:700;text-decoration:none';lnk.textContent='jsonbin.io';
    s1t.appendChild(document.createTextNode(''));s1t.appendChild(lnk);
    s1t.appendChild(document.createTextNode(' → Sign Up (বিনামূল্যে) → Dashboard → API Keys → Master Key কপি করুন'));
    s1.appendChild(s1n);s1.appendChild(s1t);
    var s2=document.createElement('div');s2.style.cssText='display:flex;align-items:flex-start;gap:12px';
    var s2n=document.createElement('div');s2n.style.cssText='width:28px;height:28px;border-radius:9px;background:rgba(0,229,204,.15);color:var(--cyan);font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px';s2n.textContent='২';
    var s2t=document.createElement('div');s2t.style.cssText='font-size:12px;color:var(--text2);line-height:1.8;padding-top:4px';
    s2t.textContent='নিচে API Key paste করুন → সংযুক্ত করুন — শেষ!';
    s2.appendChild(s2n);s2.appendChild(s2t);
    guide.appendChild(gtitle);guide.appendChild(s1);guide.appendChild(s2);
    box.appendChild(guide);
  }

  // API Key input
  var f1=document.createElement('div');f1.className='field';
  var l1=document.createElement('label');l1.className='lbl';l1.textContent='API Key (jsonbin.io থেকে)';
  var i1=document.createElement('input');i1.className='inp';i1.id='jb-key';
  i1.placeholder='$2a$10$...';i1.autocomplete='off';i1.value=_jbKey||'';
  i1.style.fontFamily='monospace';i1.style.fontSize='12px';
  f1.appendChild(l1);f1.appendChild(i1);box.appendChild(f1);

  function mkBtn(cls,txt,fn){
    var b=document.createElement('button');b.className=cls;b.textContent=txt;
    b.style.marginBottom='9px';b.addEventListener('click',fn);box.appendChild(b);
  }

  mkBtn('btn btn-cyan','☁️ সংযুক্ত করুন',function(){
    var k=document.getElementById('jb-key').value.trim();
    if(!k){toast('⚠️ API Key দিন!',true);return;}
    _jbKey=k;localStorage.setItem('nb3_jbkey',k);
    closeSheet();
    jbLoad(); // প্রথমে cloud থেকে load
    toast('🔄 Sync হচ্ছে...');
  });

  if(_jbKey && _jbBin){
    mkBtn('btn btn-blue','🔄 এখনই Sync করুন',function(){closeSheet();jbSave();toast('🔄 Sync হচ্ছে...');});
    mkBtn('btn btn-orange','📥 Cloud থেকে Load করুন',function(){closeSheet();jbLoad();});
    mkBtn('btn btn-red','🔌 সংযোগ বিচ্ছিন্ন',function(){
      _jbKey='';_jbBin='';
      localStorage.removeItem('nb3_jbkey');localStorage.removeItem('nb3_jbbin');
      updSyncChip(false);closeSheet();toast('🔌 Cloud Sync বন্ধ!');
    });
  }
  mkBtn('btn btn-ghost','বাতিল',closeSheet);

  ov.appendChild(box);document.body.appendChild(ov);
}

function editComp(){
  showSheet(`<div>
    <div class="sh-knob"></div>
    <div class="sh-title">🏢 কোম্পানি তথ্য</div>
    <div class="field"><label class="lbl">কোম্পানির নাম</label><input class="inp" id="co-n" value="${company.name||''}"/></div>
    <div class="field"><label class="lbl">ফোন নম্বর</label><input class="inp" id="co-p" type="tel" value="${company.phone||''}"/></div>
    <div class="field"><label class="lbl">ঠিকানা</label><input class="inp" id="co-a" value="${company.address||''}"/></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeSheet()">বাতিল</button>
      <button class="btn btn-blue" onclick="saveComp()">✅ সংরক্ষণ</button>
    </div>
  </div>`);
}
function saveComp(){
  company.name=document.getElementById('co-n').value.trim()||company.name;
  company.phone=document.getElementById('co-p').value.trim()||company.phone;
  company.address=document.getElementById('co-a').value.trim();
  sv('nb3_co',company);fbPush();closeSheet();render();toast('✅ কোম্পানি তথ্য আপডেট!');
}
function pinSett(mode){
  showSheet(`<div>
    <div class="sh-knob"></div>
    <div class="sh-title">🔒 ${mode==='admin'?'অ্যাডমিন':'ক্যাশিয়ার'} পিন পরিবর্তন</div>
    <div class="field"><label class="lbl">নতুন ৪ সংখ্যার পিন</label><input class="inp" id="pin-v" type="password" maxlength="4" placeholder="XXXX" style="font-size:32px;text-align:center;letter-spacing:10px"/></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeSheet()">বাতিল</button>
      <button class="btn btn-blue" onclick="savePin('${mode}')">✅ সংরক্ষণ</button>
    </div>
  </div>`);
}
function savePin(mode){
  const pin=document.getElementById('pin-v').value;
  if(pin.length!==4||!/^\d+$/.test(pin)){toast('⚠️ ৪ সংখ্যার পিন দিন!',true);return;}
  sv(mode==='admin'?'nb3_apin':'nb3_cpin',pin);
  closeSheet();toast('✅ পিন পরিবর্তন হয়েছে!');
}

// ── Service Worker ──
if('serviceWorker' in navigator){
  var swCode=`
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
var CACHE='kn24-v1';
var URLS=['/'];
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(URLS))));
self.addEventListener('fetch',e=>e.respondWith(
  caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('/')))
));`;
  var blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
}

// ── Install Prompt ──
var _installEvt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  _installEvt=e;
  var bar=document.getElementById('install-bar');
  if(bar) bar.style.display='flex';
});
window.addEventListener('appinstalled',function(){
  var bar=document.getElementById('install-bar');
  if(bar) bar.style.display='none';
  _installEvt=null;
  toast('✅ অ্যাপ ইনস্টল হয়েছে!');
});

window.addEventListener('load',()=>{
  setTimeout(()=>{
    const sp=document.getElementById('splash');
    sp.style.transition='opacity .5s ease';sp.style.opacity='0';
    setTimeout(()=>{sp.style.display='none';checkLock();},500);
  },2000);
});
</script>
