<title>📡 NetBill</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07090f;color:#e2e8f0;font-family:'Hind Siliguri',sans-serif;overflow-x:hidden}
input,select,button,textarea{font-family:'Hind Siliguri',sans-serif}
input:focus,select:focus{outline:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1e2535;border-radius:4px}
@keyframes splashPulse{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}
.splash-dot{width:10px;height:10px;border-radius:50%;background:#38bdf8;animation:splashPulse 1.2s ease infinite;box-shadow:0 0 10px #38bdf860}
.pin-dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.15);transition:.2s}
.pin-dot.filled{background:#6366f1;border-color:#6366f1;box-shadow:0 0 10px #6366f160}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes toastDrop{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── Layout ── */
#root{display:flex;flex-direction:column;min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
#page-content{flex:1;padding:14px 14px 0;animation:fadeUp 0.3s ease}

/* ── Header ── */
#hdr{position:sticky;top:0;z-index:100;background:rgba(7,9,15,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05);padding:calc(14px + env(safe-area-inset-top)) 14px 12px}
#hdr-inner{display:flex;align-items:center;justify-content:space-between}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 16px #4f46e540;flex-shrink:0}
.logo-name{font-family:'Exo 2',sans-serif;font-weight:900;font-size:18px;color:#f1f5f9;letter-spacing:-0.5px;line-height:1}
.logo-sub{font-size:9px;color:#334155;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.hdr-btns{display:flex;gap:8px}

/* ── Bottom Nav ── */
#bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#0a0d18;border-top:1px solid rgba(255,255,255,0.06);display:flex;padding:8px 2px calc(8px + env(safe-area-inset-bottom))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;cursor:pointer;border:none;background:transparent;transition:all 0.16s;border-left:2px solid transparent}
.nav-btn .n-icon{font-size:18px;font-family:monospace;line-height:1;opacity:0.45}
.nav-btn .n-label{font-size:8.5px;font-weight:600;color:#475569;letter-spacing:0.2px;font-family:'Hind Siliguri',sans-serif}
.nav-btn.active{background:linear-gradient(135deg,rgba(79,70,229,0.22),rgba(124,58,237,0.14))}
.nav-btn.active .n-icon{opacity:1;filter:drop-shadow(0 0 5px #6366f1)}
.nav-btn.active .n-label{color:#a5b4fc}

/* ── Cards ── */
.card{background:#0d111e;border:1px solid rgba(255,255,255,0.07);border-radius:18px;margin-bottom:12px;overflow:hidden}
.card-pad{padding:16px}
.section-title{font-weight:700;font-size:15px;color:#f1f5f9;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* ── Buttons ── */
.btn{border:none;border-radius:13px;padding:13px 16px;cursor:pointer;font-size:14px;font-weight:700;color:#fff;font-family:'Hind Siliguri',sans-serif;width:100%;transition:all 0.15s;display:block;text-align:center}
.btn:active{transform:scale(0.97);filter:brightness(0.9)}
.btn-indigo{background:linear-gradient(135deg,#4f46e5,#6366f1);box-shadow:0 4px 20px #6366f125}
.btn-sky{background:linear-gradient(135deg,#0369a1,#0ea5e9);box-shadow:0 4px 20px #0ea5e925}
.btn-green{background:linear-gradient(135deg,#059669,#34d399);box-shadow:0 4px 20px #34d39925}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#a78bfa);box-shadow:0 4px 20px #a78bfa25}
.btn-orange{background:linear-gradient(135deg,#d97706,#fb923c);box-shadow:0 4px 20px #fb923c25}
.btn-ghost{background:rgba(255,255,255,0.03);color:#64748b;border:1px solid rgba(255,255,255,0.08)}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:10px;width:auto;display:inline-block}

/* ── Small header buttons ── */
.hbtn{border:none;border-radius:11px;padding:8px 13px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif;white-space:nowrap}
.hbtn:active{transform:scale(0.96)}

/* ── Input ── */
.inp{width:100%;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:13px;padding:12px 14px;color:#e2e8f0;font-size:15px;transition:border-color 0.15s}
.inp:focus{border-color:#6366f1;background:rgba(99,102,241,0.05)}
.inp-label{font-size:10.5px;color:#64748b;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:6px;display:block}
.field-wrap{margin-bottom:13px}

/* ── Row item ── */
.list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background 0.12s}
.list-row:last-child{border-bottom:none}
.list-row:active{background:rgba(255,255,255,0.03)}

/* ── Avatar ── */
.av{border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-family:'Exo 2',sans-serif}

/* ── Badge ── */
.badge{border-radius:7px;padding:3px 10px;font-size:10.5px;font-weight:700;display:inline-block;white-space:nowrap}

/* ── Stat grid ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{border-radius:18px;padding:16px;position:relative;overflow:hidden}
.stat-label{font-size:9.5px;color:#475569;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:7px}
.stat-val{font-family:'Exo 2',sans-serif;font-weight:900;letter-spacing:-0.5px;line-height:1}
.stat-sub{font-size:10.5px;color:#334155;margin-top:6px}
.stat-bar-wrap{margin-top:13px;height:3px;background:rgba(255,255,255,0.05);border-radius:3px}
.stat-bar{height:100%;border-radius:3px}

/* ── Progress bar ── */
.prog-wrap{height:6px;background:rgba(255,255,255,0.05);border-radius:6px;margin-top:6px}
.prog-bar{height:100%;border-radius:6px}

/* ── Modal overlay (bottom sheet) ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:500;display:flex;align-items:flex-end;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet{background:#0a0d18;border-radius:24px 24px 0 0;border-top:1px solid rgba(255,255,255,0.08);width:100%;max-height:93vh;overflow-y:auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom));animation:slideUp 0.28s cubic-bezier(0.34,1.2,0.64,1)}
.sheet-handle{width:38px;height:4px;background:rgba(255,255,255,0.13);border-radius:4px;margin:0 auto 20px}
.sheet-hdr{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.sheet-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}

/* ── Toast ── */
#toast{position:fixed;top:14px;left:12px;right:12px;z-index:9999;padding:13px 18px;border-radius:16px;font-weight:700;font-size:14px;animation:toastDrop 0.3s ease;display:none;box-shadow:0 8px 40px rgba(0,0,0,0.6);color:#fff}

/* ── Table header ── */
.tbl-hdr{padding:11px 14px;font-size:9.5px;color:#334155;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.018);display:grid;gap:8px}

/* ── Glowing dot ── */
.glow-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ── Sidebar info box (adapted as info card) ── */
.auto-sms-card{background:linear-gradient(135deg,rgba(79,70,229,0.15),rgba(124,58,237,0.08));border:1px solid rgba(99,102,241,0.18);border-radius:16px;padding:14px 15px;margin-bottom:12px;display:flex;align-items:center;gap:12px}

/* ── Divider ── */
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);margin:4px 0 14px}
</style>
</head>
<body>
<div id="root">

<!-- SPLASH SCREEN -->
<div id="splash-screen" style="position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#07090f 0%,#0f0c29 40%,#1a0533 70%,#07090f 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.6s ease">
  <div style="text-align:center">
    <!-- Icon -->
    <div style="width:110px;height:110px;border-radius:28px;overflow:hidden;margin:0 auto 24px;box-shadow:0 20px 60px rgba(14,165,233,0.4),0 0 0 1px rgba(255,255,255,0.1)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#1e1b4b"/><stop offset="50%" style="stop-color:#312e81"/><stop offset="100%" style="stop-color:#0ea5e9"/></linearGradient><linearGradient id="dish" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#a78bfa"/></linearGradient></defs><!-- Background rounded rect --><rect width="512" height="512" rx="110" fill="url(#bg)"/><!-- Glow effect --><circle cx="256" cy="220" r="130" fill="#0ea5e9" opacity="0.08"/><!-- Satellite dish bowl --><ellipse cx="220" cy="270" rx="110" ry="95" fill="none" stroke="url(#dish)" stroke-width="22" stroke-dasharray="1000" stroke-dashoffset="400" stroke-linecap="round"/><!-- Dish inner --><ellipse cx="220" cy="270" rx="70" ry="60" fill="none" stroke="#38bdf8" stroke-width="12" opacity="0.5"/><!-- Dish center dot --><circle cx="220" cy="270" r="14" fill="#38bdf8"/><!-- Dish pole --><line x1="220" y1="270" x2="220" y2="370" stroke="#a78bfa" stroke-width="18" stroke-linecap="round"/><!-- Dish base --><ellipse cx="220" cy="372" rx="45" ry="14" fill="#a78bfa" opacity="0.8"/><!-- Signal waves --><path d="M 305 160 Q 340 195 305 230" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.9"/><path d="M 325 135 Q 380 185 325 255" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.6"/><path d="M 345 110 Q 420 175 345 280" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.3"/><!-- Signal dot --><circle cx="295" cy="195" r="10" fill="#38bdf8"/><!-- BDT symbol bottom right --><text x="340" y="420" font-family="Arial" font-weight="900" font-size="72" fill="#fbbf24" opacity="0.95">৳</text></svg>
    </div>
    <div style="font-family:'Exo 2',sans-serif;font-weight:900;font-size:32px;color:#f1f5f9;letter-spacing:1px">NetBill</div>
    <div style="font-size:13px;color:#38bdf8;margin-top:6px;font-weight:600;letter-spacing:2px">WiFi BILLING MANAGER</div>
    <!-- Loading dots -->
    <div style="display:flex;gap:8px;justify-content:center;margin-top:32px">
      <div class="splash-dot" style="animation-delay:0s"></div>
      <div class="splash-dot" style="animation-delay:0.2s"></div>
      <div class="splash-dot" style="animation-delay:0.4s"></div>
    </div>
  </div>
</div>

<!-- LOCK SCREEN -->
<div id="lock-screen" style="display:none;position:fixed;inset:0;z-index:9999;background:#07090f;flex-direction:column;align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:380px">
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#1e1b4b,#4f46e5);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 16px;box-shadow:0 8px 32px #4f46e530">📡</div>
      <div style="font-family:'Exo 2',sans-serif;font-weight:900;font-size:26px;color:#f1f5f9">NetBill</div>
      <div id="lock-mode-label" style="font-size:13px;color:#475569;margin-top:4px">PIN দিয়ে প্রবেশ করুন</div>
    </div>

    <!-- পিন ডিসপ্লে -->
    <div style="display:flex;justify-content:center;gap:12px;margin-bottom:28px" id="pin-dots">
      <div class="pin-dot"></div><div class="pin-dot"></div>
      <div class="pin-dot"></div><div class="pin-dot"></div>
    </div>

    <!-- এরর মেসেজ -->
    <div id="lock-err" style="text-align:center;color:#f87171;font-size:13px;font-weight:700;margin-bottom:16px;min-height:20px"></div>

    <!-- নম্পার প্যাড -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
      ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>`
        <button onclick="pinPress('${n}')" style="background:${n===''?'transparent':'rgba(255,255,255,0.05)'};border:${n===''?'none':'1px solid rgba(255,255,255,0.08)'};border-radius:16px;padding:18px;font-size:22px;font-weight:800;font-family:'Exo 2',sans-serif;color:#f1f5f9;cursor:${n===''?'default':'pointer'};pointer-events:${n===''?'none':'auto'}">${n}</button>
      `).join('')}
    </div>

    <!-- মোড সুইচ বাটন -->
    <div id="lock-switch-wrap" style="text-align:center">
      <button onclick="switchLockMode()" id="lock-switch-btn" style="background:transparent;border:none;color:#475569;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline">ক্যাশিয়ার মোডে যান →</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- HEADER -->
<div id="hdr">
  <div id="hdr-inner">
    <div class="logo-wrap">
      <div class="logo-icon">📡</div>
      <div>
        <div class="logo-name">NetBill</div>
        <div class="logo-sub" id="hdr-sub">ড্যাশবোর্ড</div>
      </div>
    </div>
    <div class="hdr-btns">
      <button id="pwa-install-btn" onclick="triggerInstall()" style="display:none;background:linear-gradient(135deg,#166534,#16a34a);box-shadow:0 3px 12px #16a34a25;border:none;color:#fff;border-radius:11px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:800;font-family:inherit;align-items:center;gap:4px">📲 ইনস্টল</button>
      <button class="hbtn admin-only" style="background:linear-gradient(135deg,#0c4a6e,#0369a1);box-shadow:0 3px 12px #0369a125" onclick="openInstallGuide()">📱</button>

<script>
// ══════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════
const PKGS = [
  {id:1,name:"3 Mbps",speed:"3 Mbps",price:300,color:"#38bdf8",bg:"linear-gradient(145deg,#0c1e30,#091623)"},
  {id:2,name:"5 Mbps",speed:"5 Mbps",price:400,color:"#a78bfa",bg:"linear-gradient(145deg,#130d26,#0c0818)"},
  {id:3,name:"Desh 10 Mbps",speed:"10 Mbps",price:500,color:"#34d399",bg:"linear-gradient(145deg,#041a0e,#021009)"},
  {id:4,name:"Govt",speed:"Govt",price:1260,color:"#fb923c",bg:"linear-gradient(145deg,#1c0e00,#120900)"},
  {id:5,name:"কাস্টম",speed:"Custom",price:0,color:"#f43f5e",bg:"linear-gradient(145deg,#1f0a0a,#130606)"},
];
const AV_COLORS=["#6366f1","#ec4899","#14b8a6","#f97316","#8b5cf6","#06b6d4","#84cc16","#f43f5e"];

function ld(k,fb){try{const d=localStorage.getItem(k);return d?JSON.parse(d):fb}catch{return fb}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

let customers = ld('nb2_c', null);
// প্রথমবার খুললে ডেমো গ্রাহক থাকবে না — শুধু আপনার নিজের গ্রাহক
if(!customers) { customers = []; sv('nb2_c', []); }

let bills = ld('nb2_b', []);
let smsLog = ld('nb2_s',[]);
let company = ld('nb2_co',{name:"NetBill Telecom",phone:"01700-000000",address:"ঢাকা, বাংলাদেশ",smsBalance:0});
let page = 'dashboard';
let payBill = null, editC = null, editStatus = 'active';

function getPkg(id){return PKGS.find(p=>p.id===id)||PKGS[0]}
function getPkgPrice(c){
  if(c.packageId===5 && c.customPrice>0) return c.customPrice;
  return getPkg(c.packageId).price;
}
function getAv(name,id){return{bg:AV_COLORS[Math.abs(id)%AV_COLORS.length],letter:name[0]}}
function fmt(n){return Number(n).toLocaleString('bn-BD')}

// ── চলতি মাসের key (যেমন: "2026-3") ──
function monthKey(y,m){return y+'-'+m}
function currentMonthKey(){const n=new Date();return monthKey(n.getFullYear(),n.getMonth())}
function currentMonthLabel(){return new Date().toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}

// ── প্রতি মাসের ১ তারিখে শুধু সেই মাসের বিল তৈরি হবে ──
// বিলের মাসের key চেক করে duplicate এড়ানো হয়
function autoGenerateMonthlyBills(){
  const key=currentMonthKey();
  const label=currentMonthLabel();
  let changed=false;
  customers.filter(c=>c.status==='active').forEach(c=>{
    const exists=bills.find(b=>b.customerId===c.id && b.monthKey===key);
    if(!exists){
      const price=getPkgPrice(c);
      bills.push({
        id:Date.now()+Math.random(),
        customerId:c.id, customerName:c.name, phone:c.phone,
        month:label, monthKey:key,
        amount:price, paid:0, due:price,
        status:'unpaid', packageId:c.packageId
      });
      changed=true;
    }
  });
  if(changed){ sv('nb2_b',bills); autoBackup(); }
}

// ── নতুন গ্রাহক যোগ হলে শুধু চলতি মাসের বিল তৈরি ──
function addBillsFor(c){
  const key=currentMonthKey();
  const label=currentMonthLabel();
  const exists=bills.find(b=>b.customerId===c.id && b.monthKey===key);
  if(!exists && c.status==='active'){
    const price=getPkgPrice(c);
    bills.push({
      id:Date.now()+Math.random(),
      customerId:c.id, customerName:c.name, phone:c.phone,
      month:label, monthKey:key,
      amount:price, paid:0, due:price,
      status:'unpaid', packageId:c.packageId
    });
    sv('nb2_b',bills);
  }
}

// ══════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════
function toast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=err?'linear-gradient(135deg,#ef4444,#dc2626)':'linear-gradient(135deg,#059669,#10b981)';
  t.style.display='block';
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.style.display='none',3000);
}

// ══════════════════════════════════════════
//  NAV
// ══════════════════════════════════════════
const PAGE_LABELS={dashboard:'ড্যাশবোর্ড',customers:'গ্রাহক তালিকা',bills:'বিল তালিকা',payments:'পেমেন্ট',sms:'SMS লগ',settings:'সেটিংস'};
function go(pg){
  page=pg;
  document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.remove('active')});
  document.getElementById('nb-'+pg).classList.add('active');
  document.getElementById('hdr-sub').textContent=PAGE_LABELS[pg]||pg;
  render();
  document.getElementById('page-content').scrollTop=0;
}

// ══════════════════════════════════════════
//  RENDER DISPATCH
// ══════════════════════════════════════════
// ══════════════════════════════════════════
//  LOCK / CASHIER MODE
// ══════════════════════════════════════════
let _appMode   = 'admin';   // 'admin' | 'cashier'
let _lockMode  = 'admin';   // কোন মোডে ঢোকার চেষ্টা হচ্ছে
let _pinBuffer = '';
const ADMIN_PIN_KEY   = 'nb2_admin_pin';
const CASHIER_PIN_KEY = 'nb2_cashier_pin';

function getAdminPin()  { return ld(ADMIN_PIN_KEY,   ''); }
function getCashierPin(){ return ld(CASHIER_PIN_KEY, ''); }

// অ্যাপ শুরু হলে — যদি কোনো PIN সেট থাকে লক স্ক্রিন দেখাও
function checkInitialLock(){
  if(getAdminPin()){
    showLockScreen('admin');
  }
  // কোনো pin সেট না থাকলে সরাসরি admin হিসেবে ঢোকো
}

function showLockScreen(mode){
  _lockMode  = mode;
  _pinBuffer = '';
  updatePinDots();
  document.getElementById('lock-err').textContent = '';
  document.getElementById('lock-mode-label').textContent =
    mode==='admin' ? '👑 অ্যাডমিন PIN দিন' : '👤 ক্যাশিয়ার PIN দিন';
  document.getElementById('lock-switch-btn').textContent =
    mode==='admin' ? 'ক্যাশিয়ার মোডে যান →' : 'অ্যাডমিন মোডে যান →';
  // ক্যাশিয়ার pin সেট না থাকলে সুইচ বাটন লুকাও
  const hasCashier = !!getCashierPin();
  document.getElementById('lock-switch-wrap').style.display =
    (mode==='admin' && hasCashier) || (mode==='cashier') ? 'block' : 'none';

  document.getElementById('lock-screen').style.display = 'flex';
}

function hideLockScreen(){
  document.getElementById('lock-screen').style.display = 'none';
}

function switchLockMode(){
  showLockScreen(_lockMode==='admin' ? 'cashier' : 'admin');
}

function pinPress(val){
  if(val==='⌫'){
    _pinBuffer = _pinBuffer.slice(0,-1);
    updatePinDots();
    return;
  }
  if(val==='' || _pinBuffer.length>=4) return;
  _pinBuffer += val;
  updatePinDots();
  if(_pinBuffer.length===4) setTimeout(checkPin, 150);
}

function updatePinDots(){
  document.querySelectorAll('.pin-dot').forEach((d,i)=>{
    d.classList.toggle('filled', i < _pinBuffer.length);
  });
}

function checkPin(){
  const entered = _pinBuffer;
  _pinBuffer = '';
  updatePinDots();
  const errEl = document.getElementById('lock-err');

  if(_lockMode==='admin'){
    const pin = getAdminPin();
    if(!pin || entered===pin){
      _appMode = 'admin';
      hideLockScreen();
      applyMode();
      render();
    } else {
      errEl.textContent = '❌ ভুল PIN! আবার চেষ্টা করুন';
      setTimeout(()=>errEl.textContent='', 2000);
    }
  } else {
    const pin = getCashierPin();
    if(pin && entered===pin){
      _appMode = 'cashier';
      hideLockScreen();
      applyMode();
      go('payments');
    } else {
      errEl.textContent = '❌ ভুল PIN! আবার চেষ্টা করুন';
      setTimeout(()=>errEl.textContent='', 2000);
    }
  }
}

// মোড অনুযায়ী UI পরিবর্তন
function applyMode(){
  const isAdmin = _appMode==='admin';
  // হেডার বাটন
  document.querySelectorAll('.admin-only').forEach(el=>{
    el.style.display = isAdmin ? '' : 'none';
  });
  // নেভ বাটন
  ['nb-dashboard','nb-sms','nb-settings'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display = isAdmin ? '' : 'none';
  });
  // হেডার সাব টেক্সট
  const sub = document.getElementById('hdr-sub');
  if(sub && !isAdmin) sub.textContent = '👤 ক্যাশিয়ার মোড';
}

// অ্যাডমিন মোড থেকে লক করো
function lockApp(){
  if(getAdminPin()){
    _appMode='';
    showLockScreen('admin');
  } else {
    toast('⚠️ আগে সেটিংসে Admin PIN সেট করুন');
  }
}

// ক্যাশিয়ার PIN সেটিং
function openPinSettings(){
  const adminPin   = getAdminPin();
  const cashierPin = getCashierPin();
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <div class="sheet-icon" style="background:linear-gradient(135deg,#1e1b4b,#4f46e5)">🔐</div>
      <div>
        <div style="font-family:'Exo 2',sans-serif;font-weight:900;font-size:18px;color:#f1f5f9">PIN সেটিংস</div>
        <div style="font-size:12px;color:#475569;margin-top:2px">অ্যাডমিন ও ক্যাশিয়ার PIN</div>
      </div>
    </div>

    <div style="background:rgba(99,102,241,0.07);border:1px solid rgba(99,102,241,0.15);border-radius:14px;padding:14px;margin-bottom:14px;font-size:12px;color:#818cf8;line-height:1.8">
      💡 <strong>Admin PIN</strong> — আপনি ব্যবহার করবেন। সব কিছু এডিট করতে পারবেন।<br/>
      💡 <strong>ক্যাশিয়ার PIN</strong> — কর্মচারী ব্যবহার করবে। শুধু বিল পেমেন্ট করতে পারবে।
    </div>

    <label class="inp-label">👑 Admin PIN (৪ সংখ্যা)</label>
    <input class="inp" id="pin-admin" type="number" placeholder="যেমন: 1234" maxlength="4"
      style="font-size:22px;font-weight:800;letter-spacing:10px;text-align:center;margin-bottom:12px"
      value="${adminPin}"/>

    <label class="inp-label">👤 ক্যাশিয়ার PIN (৪ সংখ্যা)</label>
    <input class="inp" id="pin-cashier" type="number" placeholder="যেমন: 5678" maxlength="4"
      style="font-size:22px;font-weight:800;letter-spacing:10px;text-align:center;margin-bottom:18px"
      value="${cashierPin}"/>

    <button class="btn btn-indigo" onclick="savePinSettings()" style="margin-bottom:10px">✅ সেভ করুন</button>
    <button class="btn btn-ghost" onclick="closeSheet()">বাতিল</button>
  `);
}

function savePinSettings(){
  const ap = (document.getElementById('pin-admin').value||'').slice(0,4);
  const cp = (document.getElementById('pin-cashier').value||'').slice(0,4);
  if(ap && ap.length!==4){ toast('❌ Admin PIN অবশ্যই ৪ সংখ্যার হতে হবে',true); return; }
  if(cp && cp.length!==4){ toast('❌ ক্যাশিয়ার PIN অবশ্যই ৪ সংখ্যার হতে হবে',true); return; }
  if(ap) sv(ADMIN_PIN_KEY, ap); else localStorage.removeItem(ADMIN_PIN_KEY);
  if(cp) sv(CASHIER_PIN_KEY, cp); else localStorage.removeItem(CASHIER_PIN_KEY);
  closeSheet();
  toast('✅ PIN সেভ হয়েছে!');
}

function render(){
  const el=document.getElementById('page-content');
  el.innerHTML='';
  el.style.animation='none';
  requestAnimationFrame(()=>{
    el.style.animation='fadeUp 0.3s ease';
    if(page==='dashboard') el.innerHTML=renderDash();
    else if(page==='customers') el.innerHTML=renderCustomers();
    else if(page==='bills') el.innerHTML=renderBills();
    else if(page==='payments') el.innerHTML=renderPayments();
    else if(page==='sms') el.innerHTML=renderSMS();
    else if(page==='settings') el.innerHTML=renderSettings();
  });
}

// ══════════════════════════════════════════
//  DASHBOARD — স্মার্ট প্যানেল সিস্টেম
// ══════════════════════════════════════════

// কোন প্যানেল খোলা আছে
let _openPanels = new Set(['summary']);

function togglePanel(id){
  if(_openPanels.has(id)) _openPanels.delete(id);
  else _openPanels.add(id);
  const body = document.getElementById('panel-body-'+id);
  const arrow = document.getElementById('panel-arrow-'+id);
  if(!body) return;
  const open = _openPanels.has(id);
  body.style.display = open ? 'block' : 'none';
  if(arrow) arrow.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
}

function renderDash(){
  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);
  const active = customers.filter(c=>c.status==='active');
  const inactive = customers.filter(c=>c.status!=='active');
  const allBills = bills;
  const unpaidBills = bills.filter(b=>b.status==='unpaid');
  const partialBills = bills.filter(b=>b.status==='partial');
  const paidBills = bills.filter(b=>b.status==='paid');
  const dueCusts = customers.filter(c=>{
    const cb=bills.filter(b=>b.customerId===c.id&&b.status!=='paid');
    return cb.length>0;
  });

  // আজকের কালেকশন — paid এর time দেখে
  // Bills paid today (paid amount logged in smsLog with today's date)
  const todayPayments = smsLog.filter(l=>l.type==='payment'&&(l.time||'').includes(now.toLocaleDateString('bn-BD').slice(0,4)));
  const todayTotal = todayPayments.reduce((s,l)=>s+(l.amount||0),0);

  // এলাকাভিত্তিক গ্রাহক
  const areas = {};
  customers.forEach(c=>{
    const area = (c.address||'').split(',')[0].trim() || 'অজানা এলাকা';
    if(!areas[area]) areas[area]=[];
    areas[area].push(c);
  });

  // মোট বকেয়া টাকা
  const totalDue = bills.reduce((s,b)=>s+b.due,0);
  const totalColl = bills.reduce((s,b)=>s+b.paid,0);

  let s = '';

  // ── টপ স্ট্যাট কার্ড ──
  s += `<div class="stat-grid">
    ${[
      {label:'মোট গ্রাহক',val:customers.length,sub:active.length+' সক্রিয়',color:'#38bdf8',pct:active.length/Math.max(customers.length,1)*100},
      {label:'বকেয়া',val:'৳'+fmt(totalDue),sub:unpaidBills.length+' বিল',color:'#fb923c',pct:60},
      {label:'সংগ্রহ',val:'৳'+fmt(totalColl),sub:'মোট পরিশোধ',color:'#34d399',pct:80},
      {label:'আজ কালেকশন',val:'৳'+fmt(todayTotal),sub:todayPayments.length+'টি পেমেন্ট',color:'#a78bfa',pct:50},
    ].map(st=>`<div class="stat-card" style="background:linear-gradient(145deg,#0d1117,#090c12);border:1px solid ${st.color}18;box-shadow:0 4px 20px ${st.color}0a">
      <div class="stat-label">${st.label}</div>
      <div class="stat-val" style="color:${st.color};font-size:20px">${st.val}</div>
      <div class="stat-sub">${st.sub}</div>
      <div class="stat-bar-wrap"><div class="stat-bar" style="width:${st.pct}%;background:${st.color}"></div></div>
    </div>`).join('')}
  </div>`;

  // ── SMS ব্যালেন্স ──
  const smsbal=company.smsBalance||0;
  const balColor=smsbal<=0?'#ef4444':smsbal<50?'#fbbf24':'#22c55e';
  s+=`<div style="background:linear-gradient(145deg,#0d1117,#090c12);border:1px solid ${balColor}25;border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px">
    <div style="width:46px;height:46px;border-radius:13px;background:${balColor}15;border:1px solid ${balColor}30;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${smsbal<=0?'🚫':smsbal<50?'⚠️':'✅'}</div>
    <div style="flex:1">
      <div style="font-size:10px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:.5px">SMS ব্যালেন্স — ${company.phone}</div>
      <div style="font-family:'Exo 2',sans-serif;font-weight:900;font-size:26px;color:${balColor};line-height:1.1">৳${fmt(smsbal)}</div>
    </div>
    <button onclick="openSmsBalSheet()" style="background:${balColor}15;border:1px solid ${balColor}30;color:${balColor};border-radius:10px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit">রিচার্জ</button>
  </div>`;

  // ── প্যানেল হেল্পার ──
  function panel(id, icon, title, count, color, bodyHTML){
    const open = _openPanels.has(id);
    return `<div style="background:#0d1117;border:1px solid ${color}25;border-radius:16px;overflow:hidden;margin-bottom:10px">
      <div onclick="togglePanel('${id}')" style="display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none">
        <div style="width:40px;height:40px;border-radius:12px;background:${color}18;border:1px solid ${color}28;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${icon}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:14px;color:#f1f5f9">${title}</div>
          <div style="font-size:11px;color:#475569;margin-top:2px">${count}</div>
        </div>
        <div id="panel-arrow-${id}" style="color:${color};font-size:16px;transition:.25s;transform:${open?'rotate(180deg)':'rotate(0deg)'}">▼</div>
      </div>
      <div id="panel-body-${id}" style="display:${open?'block':'none'};border-top:1px solid rgba(255,255,255,0.05)">${bodyHTML}</div>
    </div>`;
  }

  // ── গ্রাহক রো (ড্যাশবোর্ডে) — ট্যাপে হিস্ট্রি খোলে ──
  function dashCustRow(c){
    const av=getAv(c.name,c.id);
    const cb=bills.filter(b=>b.customerId===c.id&&b.status!=='paid');
    const due=bills.filter(b=>b.customerId===c.id).reduce((s,b)=>s+b.due,0);
    const isActive=c.status==='active';
    const photoHtml=c.photo
      ?`<img src="${c.photo}" style="width:42px;height:42px;border-radius:12px;object-fit:cover;flex-shrink:0;border:2px solid ${av.bg}30"/>`
      :`<div style="width:42px;height:42px;border-radius:12px;background:${av.bg}20;color:${av.bg};font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid ${av.bg}30">${av.letter}</div>`;
    return `<div onclick="openBillHistory(${c.id})" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;active:opacity:.7" ontouchstart="this.style.background='rgba(255,255,255,0.03)'" ontouchend="this.style.background=''">
      ${photoHtml}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="font-weight:700;font-size:14px;color:#e2e8f0">${c.name}</div>
          ${!isActive?`<span style="background:rgba(239,68,68,0.12);color:#f87171;border-radius:5px;padding:1px 6px;font-size:9px;font-weight:800">বন্ধ</span>`:''}
        </div>
        <div style="font-size:11px;color:#475569;margin-top:1px">${c.phone}${c.address?` • ${c.address.split(',')[0]}`:''}</div>
        ${due>0?`<div style="margin-top:4px;display:inline-flex;align-items:center;gap:4px;background:rgba(251,146,60,0.1);border:1px solid rgba(251,146,60,0.2);border-radius:6px;padding:2px 8px">
          <span style="font-size:10px;color:#fb923c;font-weight:800">বকেয়া ৳${fmt(due)}</span>
        </div>`:'<div style="margin-top:4px;font-size:10px;color:#22c55e;font-weight:600">✅ পরিশোধিত</div>'}
      </div>
      <div style="display:flex;align-items:center;gap:5px;flex-shrink:0">
        <a href="tel:${c.phone}" onclick="event.stopPropagation()"
          style="background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#22c55e;border-radius:8px;padding:7px 9px;font-size:14px;text-decoration:none;line-height:1">📞</a>
        <button onclick="event.stopPropagation();toggleConnection(${c.id})"
          style="background:${isActive?'rgba(34,197,94,0.1)':'rgba(239,68,68,0.1)'};border:2px solid ${isActive?'rgba(34,197,94,0.25)':'rgba(239,68,68,0.3)'};color:${isActive?'#22c55e':'#f87171'};border-radius:8px;padding:6px 9px;cursor:pointer;font-size:11px;font-weight:800;font-family:inherit">${isActive?'🟢':'🔴'}</button>
        <div style="color:#334155;font-size:14px">›</div>
      </div>
    </div>`;
  }

  // ── বিল রো ──
  function dashBillRow(b){
    const av=getAv(b.customerName,b.customerId);
    const statusColor=b.status==='paid'?'#22c55e':b.status==='partial'?'#fbbf24':'#fb923c';
    const statusLabel=b.status==='paid'?'পরিশোধ':b.status==='partial'?'আংশিক':'বকেয়া';
    return `<div style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.04)">
      <div style="width:38px;height:38px;border-radius:11px;background:${av.bg}20;color:${av.bg};font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0">${av.letter}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13px;color:#e2e8f0">${b.customerName}</div>
        <div style="font-size:11px;color:#475569">${b.month} • ${b.phone}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
        <div style="text-align:right">
          <div style="font-weight:800;font-size:14px;color:${statusColor};font-family:'Exo 2',sans-serif">৳${b.due>0?b.due:b.paid}</div>
          <div style="font-size:9px;color:${statusColor}99;font-weight:700">${statusLabel}</div>
        </div>
        ${b.status!=='paid'?`<button onclick="openPayModal(${b.id})" style="background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.25);color:#fbbf24;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit">💳 পে</button>`:''}
      </div>
    </div>`;
  }

  // ══ প্যানেল ১: সকল গ্রাহক ══
  s += panel('all', '👥', 'সকল গ্রাহক', customers.length+'জন গ্রাহক', '#38bdf8',
    customers.length===0
      ? `<div style="padding:24px;text-align:center;color:#334155">কোনো গ্রাহক নেই</div>`
      : customers.map(dashCustRow).join('')
  );

  // ══ প্যানেল ২: বন্ধ গ্রাহক ══
  s += panel('inactive', '🔴', 'বন্ধ গ্রাহক', inactive.length+'জন নিষ্ক্রিয়', '#f87171',
    inactive.length===0
      ? `<div style="padding:24px;text-align:center;color:#334155">সব গ্রাহক সক্রিয় ✅</div>`
      : inactive.map(dashCustRow).join('')
  );

  // ══ প্যানেল ৩: বকেয়া গ্রাহক ══
  s += panel('due', '⚠️', 'বকেয়া গ্রাহক', dueCusts.length+'জনের বকেয়া আছে', '#fb923c',
    dueCusts.length===0
      ? `<div style="padding:24px;text-align:center;color:#334155">কোনো বকেয়া নেই 🎉</div>`
      : dueCusts.map(dashCustRow).join('')
  );

  // ══ প্যানেল ৪: আংশিক পরিশোধ ══
  s += panel('partial', '🔶', 'আংশিক পরিশোধ', partialBills.length+'টি বিল', '#fbbf24',
    partialBills.length===0
      ? `<div style="padding:24px;text-align:center;color:#334155">কোনো আংশিক বিল নেই</div>`
      : partialBills.map(dashBillRow).join('')
  );

  // ══ প্যানেল ৫: পরিশোধ হয়েছে ══
  const recentPaid = paidBills.slice(0,20);
  s += panel('paid', '✅', 'পরিশোধ হয়েছে', paidBills.length+'টি বিল', '#22c55e',
    paidBills.length===0
      ? `<div style="padding:24px;text-align:center;color:#334155">কোনো পরিশোধিত বিল নেই</div>`
      : recentPaid.map(dashBillRow).join('')+(paidBills.length>20?`<div style="padding:10px;text-align:center;font-size:12px;color:#334155">আরো ${paidBills.length-20}টি বিল আছে</div>`:'')
  );

  // ══ প্যানেল ৬: আজকের কালেকশন ══
  const todayLogs = smsLog.filter(l=>l.type==='payment');
  s += panel('today', '💰', 'আজকের কালেকশন', '৳'+fmt(todayTotal)+' ('+todayPayments.length+'টি)', '#34d399',
    `<div style="padding:14px 16px;background:rgba(52,211,153,0.06);border-bottom:1px solid rgba(255,255,255,0.05)">
      <div style="font-family:'Exo 2',sans-serif;font-weight:900;font-size:32px;color:#34d399;text-align:center">৳${fmt(todayTotal)}</div>
      <div style="text-align:center;font-size:12px;color:#475569;margin-top:4px">আজ মোট কালেকশন</div>
    </div>`+
    (todayLogs.length===0
      ? `<div style="padding:24px;text-align:center;color:#334155">আজ কোনো পেমেন্ট নেই</div>`
      : todayLogs.slice(0,15).map(l=>`
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04)">
          <div style="width:36px;height:36px;border-radius:10px;background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">💵</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13px;color:#e2e8f0">${l.name}</div>
            <div style="font-size:11px;color:#475569">${l.time}</div>
          </div>
          <div style="font-weight:800;font-size:15px;color:#34d399;font-family:'Exo 2',sans-serif">৳${l.amount||0}</div>
        </div>`).join(''))
  );

  // ══ প্যানেল ৭: এলাকাভিত্তিক ══
  const areaHTML = Object.entries(areas).map(([area, custs])=>{
    const areaDue=bills.filter(b=>custs.find(c=>c.id===b.customerId)&&b.due>0).reduce((s,b)=>s+b.due,0);
    return `<div style="border-bottom:1px solid rgba(255,255,255,0.05)">
      <div style="padding:10px 14px 8px;font-size:11px;color:#818cf8;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:rgba(99,102,241,0.04)">
        📍 ${area} — ${custs.length}জন${areaDue>0?` • বকেয়া ৳${fmt(areaDue)}`:''}
      </div>
      ${custs.map(dashCustRow).join('')}
    </div>`;
  }).join('');
  s += panel('area', '📍', 'এলাকাভিত্তিক', Object.keys(areas).length+'টি এলাকা', '#818cf8', areaHTML||`<div style="padding:24px;text-align:center;color:#334155">কোনো গ্রাহক নেই</div>`);

  // ══ প্যানেল ৮: প্যাকেজ সারসংক্ষেপ ══
  const pkgHTML = `<div style="padding:14px 16px">`+PKGS.map(p=>{
    const cnt=customers.filter(c=>c.packageId===p.id&&c.status==='active').length;
    const pct=active.length>0?cnt/active.length*100:0;
    return `<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:7px">
          <div style="width:10px;height:10px;border-radius:50%;background:${p.color};box-shadow:0 0 6px ${p.color}"></div>
          <span style="font-weight:700;font-size:13px;color:#e2e8f0">${p.name}</span>
        </div>
        <span style="font-weight:800;color:${p.color};font-family:'Exo 2',sans-serif">${cnt}জন</span>
      </div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%;background:${p.color}"></div></div>
    </div>`;
  }).join('')+`</div>`;
  s += panel('pkg', '📦', 'প্যাকেজ সারসংক্ষেপ', active.length+'জন সক্রিয়', '#a78bfa', pkgHTML);

  return s;
}

function renderCustomers(){
  const active=customers.filter(c=>c.status==='active').length;
  const sorted=[...customers].sort((a,b)=>(b.due||0)-(a.due||0));
  let s=`<div>
    <div style="position:relative;margin-bottom:10px">
      <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;color:#334155">🔍</span>
      <input class="inp" id="srch" placeholder="নাম বা ফোন খুঁজুন..." oninput="filterC(this.value)" style="padding-left:38px"/>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px">
      <div style="background:#041a0e;border:1px solid rgba(34,197,94,0.18);border-radius:13px;padding:11px;text-align:center">
        <div style="font-size:22px;font-weight:900;color:#22c55e;font-family:'Exo 2',sans-serif">${active}</div>
        <div style="font-size:9px;color:#475569;font-weight:700;margin-top:3px">সক্রিয় গ্রাহক</div>
      </div>
      <div style="background:#200800;border:1px solid rgba(239,68,68,0.18);border-radius:13px;padding:11px;text-align:center">
        <div style="font-size:22px;font-weight:900;color:#f87171;font-family:'Exo 2',sans-serif">${customers.length-active}</div>
        <div style="font-size:9px;color:#475569;font-weight:700;margin-top:3px">নিষ্ক্রিয় গ্রাহক</div>
      </div>
    </div>
    <div id="c-list">`;

  if(customers.length===0){
    s+=`<div style="text-align:center;padding:44px;color:#334155"><div style="font-size:40px;margin-bottom:10px">👤</div><div style="font-size:14px;font-weight:600">কোনো গ্রাহক নেই</div></div>`;
  } else {
    customers.forEach(c=>{ s+=customerFolderCard(c); });
  }
  s+='</div></div>';
  return s;
}

function customerFolderCard(c){
  const av=getAv(c.name,c.id);
  const p=getPkg(c.packageId);
  const cBills=bills.filter(b=>b.customerId===c.id).sort((a,b)=>b.id-a.id);
  const due=cBills.reduce((s,b)=>s+b.due,0);
  const paid=cBills.reduce((s,b)=>s+b.paid,0);
  const isActive=c.status==='active';
  const price=getPkgPrice(c);
  const unpaid=cBills.filter(b=>b.status!=='paid');

  const photoHtml=c.photo
    ?`<img src="${c.photo}" style="width:46px;height:46px;border-radius:13px;object-fit:cover;flex-shrink:0;border:2px solid ${av.bg}40"/>`
    :`<div style="width:46px;height:46px;border-radius:13px;background:${av.bg}20;color:${av.bg};font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid ${av.bg}30">${av.letter}</div>`;

  const header=`<div style="display:flex;align-items:center;gap:12px;padding:14px 0 14px 14px" data-name="${c.name}" data-phone="${c.phone}" data-addr="${c.address||''}">
    ${photoHtml}
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:7px">
        <div style="font-weight:800;font-size:15px;color:#f1f5f9">${c.name}</div>
        <span style="background:${isActive?'rgba(34,197,94,0.12)':'rgba(239,68,68,0.12)'};color:${isActive?'#22c55e':'#f87171'};border-radius:5px;padding:1px 7px;font-size:9px;font-weight:800">${isActive?'চালু':'বন্ধ'}</span>
      </div>
      <div style="font-size:11px;color:#475569;margin-top:2px">${c.phone}${c.address?' • '+c.address.split(',')[0]:''}</div>
      <div style="display:flex;gap:5px;margin-top:5px;flex-wrap:wrap">
        <span style="background:${p.color}15;color:${p.color};border:1px solid ${p.color}25;border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700">${p.name} ৳${price}</span>
        ${due>0?`<span style="background:rgba(251,146,60,0.12);color:#fb923c;border:1px solid rgba(251,146,60,0.22);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:800">বকেয়া ৳${fmt(due)}</span>`:'<span style="background:rgba(34,197,94,0.1);color:#22c55e;border:1px solid rgba(34,197,94,0.18);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700">✅ পরিশোধ</span>'}
      </div>
    </div>
  </div>`;

  const body=`<div style="padding:0">
    <!-- অ্যাকশন বাটন -->
    <div style="display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);flex-wrap:wrap">
      <a href="tel:${c.phone}" style="flex:1;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.22);color:#22c55e;border-radius:10px;padding:9px;font-size:13px;font-weight:700;text-align:center;text-decoration:none;font-family:inherit">📞 কল</a>
      <button onclick="openEdit(${c.id})" style="flex:1;background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.2);color:#818cf8;border-radius:10px;padding:9px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit">✏️ এডিট</button>
      <button onclick="toggleConnection(${c.id})" style="flex:1;background:${isActive?'rgba(239,68,68,0.1)':'rgba(34,197,94,0.1)'};border:1px solid ${isActive?'rgba(239,68,68,0.22)':'rgba(34,197,94,0.22)'};color:${isActive?'#f87171':'#22c55e'};border-radius:10px;padding:9px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit">${isActive?'🔴 বন্ধ':'🟢 চালু'}</button>
      ${unpaid.length>0?`<button onclick="openPayModal(${unpaid[0].id})" style="flex:1;background:linear-gradient(135deg,#166534,#16a34a);border:none;color:#fff;border-radius:10px;padding:9px;cursor:pointer;font-size:13px;font-weight:800;font-family:inherit">💳 পে</button>`:''}
    </div>
    <!-- বিল তালিকা -->
    ${cBills.length===0
      ?`<div style="padding:20px;text-align:center;color:#334155;font-size:12px">এখনো কোনো বিল নেই</div>`
      :cBills.map(b=>{
          const sCo=b.status==='paid'?'#34d399':b.status==='partial'?'#fbbf24':'#fb923c';
          const sLb=b.status==='paid'?'✅ পরিশোধিত':b.status==='partial'?'⚡ আংশিক':'⚠️ বকেয়া';
          return `<div style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.04)">
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:13px;color:#e2e8f0">${b.month}</div>
              <div style="display:flex;gap:5px;margin-top:4px;flex-wrap:wrap">
                <span style="background:${sCo}15;color:${sCo};border-radius:5px;padding:1px 7px;font-size:10px;font-weight:800">${sLb}</span>
                ${b.paid>0?`<span style="font-size:11px;color:#34d399;font-weight:600">পরিশোধ ৳${b.paid}</span>`:''}
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:7px;flex-shrink:0">
              <div style="text-align:right">
                <div style="font-size:10px;color:#475569">মোট ৳${b.amount}</div>
                ${b.due>0?`<div style="font-size:17px;font-weight:900;color:#fb923c;font-family:'Exo 2',sans-serif;line-height:1.2">৳${b.due}</div>`:'<div style="color:#34d399;font-size:13px">✅</div>'}
              </div>
              ${b.status!=='paid'?`<button onclick="openPayModal(${b.id})" style="background:linear-gradient(135deg,#166534,#16a34a);border:none;color:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;font-size:12px;font-weight:800;font-family:inherit">💳</button>`:''}
            </div>
          </div>`;
        }).join('')}
    <!-- সারাংশ -->
    ${cBills.length>0?`<div style="display:flex;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,0.01);font-size:12px">
      <span style="color:#34d399;font-weight:700">মোট সংগ্রহ ৳${fmt(paid)}</span>
      <span style="color:${due>0?'#fb923c':'#475569'};font-weight:700">মোট বকেয়া ৳${fmt(due)}</span>
    </div>`:''}
  </div>`;

  return fCard('cust-'+c.id, header, body, true);
}

  const av=getAv(c.name,c.id);
  const cBills=bills.filter(b=>b.customerId===c.id);
  const due=cBills.reduce((s,b)=>s+b.due,0);
  const price=getPkgPrice(c);
  const isActive=c.status==='active';
  const avatarHtml=c.photo
    ?`<img src="${c.photo}" style="width:44px;height:44px;border-radius:13px;object-fit:cover;border:2px solid ${av.bg}40;flex-shrink:0" onclick="openEdit(${c.id})"/>`
    :`<div class="av" style="width:44px;height:44px;background:${av.bg}22;color:${av.bg};font-size:17px;border:1px solid ${av.bg}30;flex-shrink:0" onclick="openEdit(${c.id})">${av.letter}</div>`;
  return `<div class="list-row" data-name="${c.name}" data-phone="${c.phone}" data-addr="${c.address||''}">

function filterC(v){
  const q=v.trim().toLowerCase();
  document.querySelectorAll('#c-list [data-name]').forEach(el=>{
    const folder=el.closest('[id^="fb-cust-"]')||el.closest('[style*="border-radius:16px"]');
    const match=!q||[el.dataset.name||'',el.dataset.phone||'',el.dataset.addr||''].some(x=>x.toLowerCase().includes(q));
    // Show/hide the whole fCard wrapper
    const card=el.closest('[style*="margin-bottom:10px"]');
    if(card) card.style.display=match?'block':'none';
  });
}

function toggleConnection(id){
  const idx=customers.findIndex(c=>c.id===id); if(idx===-1)return;
  const c=customers[idx];
  const willBeActive = c.status!=='active';
  customers[idx].status = willBeActive?'active':'inactive';
  sv('nb2_c',customers); autoBackup();

  const msg = willBeActive
    ? `সম্মানিত গ্রাহাক ${c.name}, আপনার সংযোগটি পুনরায় চালু করা হয়েছে বকেয়া পরিশোধের মাধ্যমে। ধন্যবাদ। - ${company.name} (${company.phone})`
    : `সম্মানিত গ্রাহাক ${c.name}, আপনার সংযোগটি নিরবচ্ছিন্ন করা হলো বকেয়া থাকার কারণে। শীঘ্রই বকেয়া পরিশোধ করুন। - ${company.name} (${company.phone})`;

  const log={id:Date.now(),type:willBeActive?'reconnect':'disconnect',phone:c.phone,name:c.name,from:company.phone,fromName:company.name,msg,time:new Date().toLocaleString('bn-BD')};
  smsLog.unshift(log); sv('nb2_s',smsLog);
  render();
  showSMSSuccess(log);
}

// ══════════════════════════════════════════
//  FOLDER TOGGLE — সব পেজে ব্যবহার হয়
// ══════════════════════════════════════════
let _openFolders = {};  // key: pageName+id → bool

function fToggle(key){
  _openFolders[key] = !_openFolders[key];
  const body  = document.getElementById('fb-'+key);
  const arrow = document.getElementById('fa-'+key);
  if(!body) return;
  const open = !!_openFolders[key];
  body.style.display = open ? 'block' : 'none';
  if(arrow) arrow.style.transform = open ? 'rotate(180deg)' : 'rotate(0)';
}

// ── ফোল্ডার কার্ড হেল্পার ──
function fCard(key, headerHTML, bodyHTML, defaultOpen){
  if(!(key in _openFolders)) _openFolders[key] = !!defaultOpen;
  const open = !!_openFolders[key];
  return `<div style="background:#0d1117;border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;margin-bottom:10px">
    <div onclick="fToggle('${key}')" style="display:flex;align-items:center;gap:0;cursor:pointer;user-select:none">
      <div style="flex:1;min-width:0">${headerHTML}</div>
      <div id="fa-${key}" style="padding:0 14px;color:#334155;font-size:16px;transition:.25s;transform:${open?'rotate(180deg)':'rotate(0)'}">▼</div>
    </div>
    <div id="fb-${key}" style="display:${open?'block':'none'};border-top:1px solid rgba(255,255,255,0.05)">${bodyHTML}</div>
  </div>`;
}

// ══════════════════════════════════════════
//  BILLS — গ্রাহক ফোল্ডার
// ══════════════════════════════════════════
function renderBills(){
  // গ্রাহক অনুযায়ী গ্রুপ
  const groups = {};
  customers.forEach(c=>{
    const cb = bills.filter(b=>b.customerId===c.id).sort((a,b)=>b.id-a.id);
    if(cb.length>0) groups[c.id]={c, bills:cb};
  });
  // বিল আছে কিন্তু গ্রাহক ডিলিট হয়েছে এমনগুলোও
  bills.forEach(b=>{
    if(!groups[b.customerId]){
      if(!groups['x'+b.customerId]) groups['x'+b.customerId]={c:{id:b.customerId,name:b.customerName,phone:b.phone,packageId:b.packageId},bills:[]};
      groups['x'+b.customerId].bills.push(b);
    }
  });

  const totalBills = bills.length;
  const paidCount  = bills.filter(b=>b.status==='paid').length;
  const dueCount   = bills.filter(b=>b.status!=='paid').length;
  const totalDue   = bills.reduce((s,b)=>s+b.due,0);

  let s=`<div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px">
      ${[
        {l:'মোট বিল',v:totalBills+'টি',c:'#38bdf8',bg:'#0c1e30'},
        {l:'বকেয়া টাকা',v:'৳'+fmt(totalDue),c:'#fb923c',bg:'#1c0e00'},
        {l:'পরিশোধিত',v:paidCount+'টি',c:'#34d399',bg:'#041a0e'},
        {l:'অপরিশোধিত',v:dueCount+'টি',c:'#fbbf24',bg:'#1a1200'},
      ].map(x=>`<div style="background:${x.bg};border:1px solid ${x.c}20;border-radius:13px;padding:12px;text-align:center">
        <div style="font-size:18px;font-weight:900;color:${x.c};font-family:'Exo 2',sans-serif">${x.v}</div>
        <div style="font-size:9px;color:#475569;font-weight:700;margin-top:3px">${x.l}</div>
      </div>`).join('')}
    </div>`;

  if(Object.keys(groups).length===0){
    s+=`<div style="text-align:center;padding:44px;color:#334155"><div style="font-size:40px;margin-bottom:10px">📭</div><div style="font-size:14px">কোনো বিল নেই</div></div>`;
  } else {
    Object.values(groups).forEach(({c, bills:cb})=>{
      const av      = getAv(c.name, c.id);
      const due     = cb.reduce((s,b)=>s+b.due,0);
      const paid    = cb.reduce((s,b)=>s+b.paid,0);
      const hasDue  = due > 0;
      const p       = getPkg(c.packageId);
      const cust    = customers.find(x=>x.id===c.id);

      const header = `<div style="display:flex;align-items:center;gap:12px;padding:14px 0 14px 14px">
        ${cust&&cust.photo
          ?`<img src="${cust.photo}" style="width:42px;height:42px;border-radius:12px;object-fit:cover;flex-shrink:0;border:2px solid ${av.bg}40"/>`
          :`<div style="width:42px;height:42px;border-radius:12px;background:${av.bg}20;color:${av.bg};font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid ${av.bg}30">${av.letter}</div>`}
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:15px;color:#f1f5f9">${c.name}</div>
          <div style="font-size:11px;color:#475569;margin-top:2px">${c.phone} • ${p.name}</div>
          <div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">
            <span style="background:rgba(99,102,241,0.1);color:#818cf8;border:1px solid rgba(99,102,241,0.18);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700">${cb.length}টি বিল</span>
            ${paid>0?`<span style="background:rgba(52,211,153,0.1);color:#34d399;border:1px solid rgba(52,211,153,0.18);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700">পরিশোধ ৳${fmt(paid)}</span>`:''}
            ${hasDue?`<span style="background:rgba(251,146,60,0.1);color:#fb923c;border:1px solid rgba(251,146,60,0.2);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800">বকেয়া ৳${fmt(due)}</span>`:'<span style="background:rgba(34,197,94,0.1);color:#22c55e;border:1px solid rgba(34,197,94,0.18);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700">✅ পরিশোধিত</span>'}
          </div>
        </div>
      </div>`;

      const body = cb.map(b=>{
        const sCo = b.status==='paid'?'#34d399':b.status==='partial'?'#fbbf24':'#fb923c';
        const sLb = b.status==='paid'?'✅ পরিশোধিত':b.status==='partial'?'⚡ আংশিক':'⚠️ বকেয়া';
        return `<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04)">
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:14px;color:#e2e8f0">${b.month}</div>
            <div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">
              <span style="background:${sCo}15;color:${sCo};border:1px solid ${sCo}25;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800">${sLb}</span>
              ${b.paid>0?`<span style="font-size:11px;color:#34d399;font-weight:600">পরিশোধ ৳${b.paid}</span>`:''}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <div style="text-align:right">
              <div style="font-size:10px;color:#475569">মোট ৳${b.amount}</div>
              ${b.due>0?`<div style="font-size:18px;font-weight:900;color:#fb923c;font-family:'Exo 2',sans-serif;line-height:1.2">৳${b.due}</div>`:'<div style="font-size:13px;color:#34d399">✅</div>'}
            </div>
            ${b.status!=='paid'?`<button onclick="openPayModal(${b.id})" style="background:linear-gradient(135deg,#166534,#16a34a);border:none;color:#fff;border-radius:11px;padding:10px 14px;cursor:pointer;font-size:13px;font-weight:800;font-family:inherit;box-shadow:0 3px 10px #16a34a30">💳 পে</button>`:''}
          </div>
        </div>`;
      }).join('');

      s += fCard('bill-'+c.id, header, body, true);
    });
  }

  s+='</div>';
  return s;
}

// ══════════════════════════════════════════
//  PAYMENTS — গ্রাহক ফোল্ডার
// ══════════════════════════════════════════
function renderPayments(){
  const groups = {};
  customers.forEach(c=>{
    const cb = bills.filter(b=>b.customerId===c.id).sort((a,b)=>b.id-a.id);
    groups[c.id]={c, bills:cb};
  });

  const totalDue   = bills.reduce((s,b)=>s+b.due,0);
  const totalPaid  = bills.reduce((s,b)=>s+b.paid,0);
  const dueCusts   = Object.values(groups).filter(({bills:cb})=>cb.some(b=>b.status!=='paid')).length;

  let s=`<div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px">
      ${[
        {l:'মোট বকেয়া',v:'৳'+fmt(totalDue),c:'#fb923c',bg:'#1c0e00'},
        {l:'মোট সংগ্রহ',v:'৳'+fmt(totalPaid),c:'#34d399',bg:'#041a0e'},
        {l:'বকেয়া গ্রাহক',v:dueCusts+'জন',c:'#fbbf24',bg:'#1a1200'},
        {l:'মোট গ্রাহক',v:customers.length+'জন',c:'#38bdf8',bg:'#0c1e30'},
      ].map(x=>`<div style="background:${x.bg};border:1px solid ${x.c}20;border-radius:13px;padding:12px;text-align:center">
        <div style="font-size:18px;font-weight:900;color:${x.c};font-family:'Exo 2',sans-serif">${x.v}</div>
        <div style="font-size:9px;color:#475569;font-weight:700;margin-top:3px">${x.l}</div>
      </div>`).join('')}
    </div>`;

  Object.values(groups).forEach(({c, bills:cb})=>{
    if(cb.length===0) return;
    const av     = getAv(c.name, c.id);
    const due    = cb.reduce((s,b)=>s+b.due,0);
    const paid   = cb.reduce((s,b)=>s+b.paid,0);
    const hasDue = due>0;
    const p      = getPkg(c.packageId);
    const cust   = customers.find(x=>x.id===c.id);
    const unpaid = cb.filter(b=>b.status!=='paid');

    const header = `<div style="display:flex;align-items:center;gap:12px;padding:14px 0 14px 14px">
      ${cust&&cust.photo
        ?`<img src="${cust.photo}" style="width:42px;height:42px;border-radius:12px;object-fit:cover;flex-shrink:0;border:2px solid ${av.bg}40"/>`
        :`<div style="width:42px;height:42px;border-radius:12px;background:${av.bg}20;color:${av.bg};font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid ${av.bg}30">${av.letter}</div>`}
      <div style="flex:1;min-width:0">
        <div style="font-weight:800;font-size:15px;color:#f1f5f9">${c.name}</div>
        <div style="font-size:11px;color:#475569;margin-top:2px">${c.phone} • ${p.name}</div>
        <div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">
          ${paid>0?`<span style="background:rgba(52,211,153,0.1);color:#34d399;border:1px solid rgba(52,211,153,0.18);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700">সংগ্রহ ৳${fmt(paid)}</span>`:''}
          ${hasDue?`<span style="background:rgba(251,146,60,0.1);color:#fb923c;border:1px solid rgba(251,146,60,0.2);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800">বকেয়া ৳${fmt(due)}</span>`:'<span style="background:rgba(34,197,94,0.1);color:#22c55e;border:1px solid rgba(34,197,94,0.18);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700">✅ পরিশোধিত</span>'}
        </div>
      </div>
      ${hasDue&&unpaid.length>0?`<div onclick="event.stopPropagation();openPayModal(${unpaid[0].id})" style="background:linear-gradient(135deg,#166534,#16a34a);color:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;font-size:13px;font-weight:800;font-family:inherit;margin-right:4px;box-shadow:0 3px 12px #16a34a25;white-space:nowrap">💳 পে</div>`:''}

    const body = `

          <div style="text-align:center;background:rgba(52,211,153,0.06);border:1px solid rgba(52,211,153,0.15);border-radius:10px;padding:10px">

            <div style="font-size:9px;color:#475569;font-weight:700;margin-top:2px">পরিশোধিত</div>
          </div>
          <div style="text-align:center;background:rgba(251,146,60,0.06);border:1px solid rgba(251,146,60,0.15);border-radius:10px;padding:10px">
            <div style="font-size:15px;font-weight:900;color:#fb923c;font-family:'Exo 2',sans-serif">৳${fmt(due)}</div>
            <div style="font-size:9px;color:#475569;font-weight:700;margin-top:2px">বকেয়া</div>
          </div>
          <div style="text-align:center;background:rgba(99,102,241,0.06);border:1px solid rgba(99,102,241,0.15);border-radius:10px;padding:10px">

            <div style="font-size:9px;color:#475569;font-weight:700;margin-top:2px">মোট বিল</div>
          </div>
        </div>
        ${cb.map(b=>{
          const sCo=b.status==='paid'?'#34d399':b.status==='partial'?'#fbbf24':'#fb923c';
          const sLb=b.status==='paid'?'✅ পরিশোধিত':b.status==='partial'?'⚡ আংশিক':'⚠️ বকেয়া';
          return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
            <div style="flex:1">
              <div style="font-weight:700;font-size:13px;color:#e2e8f0">${b.month}</div>
              <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
                <span style="background:${sCo}15;color:${sCo};border-radius:5px;padding:1px 7px;font-size:10px;font-weight:800">${sLb}</span>

              ${b.status!=='paid'?`<button onclick="openPayModal(${b.id})" style="background:linear-gradient(135deg,#166534,#16a34a);border:none;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:800;font-family:inherit">💳</button>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>`;

    s += fCard('pay-'+c.id, header, body, true);
  });

  s+='</div>';
  return s;
}

// ══════════════════════════════════════════
//  SMS LOG — fCard ফোল্ডার
// ══════════════════════════════════════════
function renderSMS(){
  const groups = {};
  smsLog.forEach(log=>{
    const key = log.phone || 'unknown';
    if(!groups[key]) groups[key]={name:log.name, phone:log.phone, logs:[]};
    groups[key].logs.push(log);
  });

  const totalCusts = Object.keys(groups).length;
  const payCount   = smsLog.filter(l=>l.type==='payment').length;

  let s=`<div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
      ${[
        {icon:'👥',label:'গ্রাহক',val:totalCusts+'জন',color:'#38bdf8',bg:'#0c1e30'},
        {icon:'💳',label:'পেমেন্ট',val:payCount+'টি',color:'#34d399',bg:'#041a0e'},
        {icon:'📱',label:'মোট SMS',val:smsLog.length+'টি',color:'#a78bfa',bg:'#130d26'},
      ].map(x=>`<div style="background:${x.bg};border:1px solid ${x.color}18;border-radius:14px;padding:12px;text-align:center">
        <div style="font-size:20px;margin-bottom:5px">${x.icon}</div>
        <div style="font-size:9px;color:#475569;font-weight:700">${x.label}</div>
        <div style="font-size:15px;font-weight:900;color:${x.color};font-family:'Exo 2',sans-serif;margin-top:3px">${x.val}</div>
      </div>`).join('')}
    </div>`;

  if(smsLog.length===0){
    s+=`<div style="text-align:center;padding:52px 0">
      <div style="font-size:44px;opacity:0.3;margin-bottom:12px">📭</div>
      <div style="font-size:14px;color:#334155;font-weight:600">কোনো SMS পাঠানো হয়নি</div>
    </div>`;
  } else {
    Object.values(groups).forEach(group=>{
      const av        = getAv(group.name, group.phone);
      const safeId    = 'sms'+(group.phone||'').replace(/\D/g,'');
      const payLogs   = group.logs.filter(l=>l.type==='payment');
      const totalPaid = payLogs.reduce((s,l)=>s+(l.amount||0),0);
      const cust      = customers.find(c=>c.phone===group.phone);

      const smsHeader = `<div style="display:flex;align-items:center;gap:12px;padding:14px 0 14px 14px">
        ${cust&&cust.photo
          ?`<img src="${cust.photo}" style="width:44px;height:44px;border-radius:13px;object-fit:cover;border:2px solid ${av.bg}40;flex-shrink:0"/>`
          :`<div style="width:44px;height:44px;border-radius:13px;background:${av.bg}20;color:${av.bg};font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid ${av.bg}30">${av.letter}</div>`}
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:15px;color:#f1f5f9">${group.name}</div>
          <div style="font-size:11px;color:#475569;margin-top:2px">${group.phone}</div>
          <div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">
            <span style="background:rgba(99,102,241,0.12);color:#818cf8;border:1px solid rgba(99,102,241,0.2);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700">${group.logs.length}টি SMS</span>
            ${totalPaid>0?`<span style="background:rgba(52,211,153,0.1);color:#34d399;border:1px solid rgba(52,211,153,0.18);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700">৳${fmt(totalPaid)}</span>`:''}
          </div>
        </div>
        <a href="tel:${group.phone}" onclick="event.stopPropagation()" style="background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#22c55e;border-radius:8px;padding:7px 10px;font-size:14px;text-decoration:none;margin-right:4px;flex-shrink:0">📞</a>
      </div>`;

      const smsMsgs = group.logs.map(log=>{
        const isPay     = log.type==='payment';
        const isWelcome = log.type==='welcome';
        const isDisconn = log.type==='disconnect';
        const isReconn  = log.type==='reconnect';
        const typeColor = isPay?'#34d399':isWelcome?'#38bdf8':isDisconn?'#f87171':isReconn?'#22c55e':'#818cf8';
        const typeLabel = isPay?'💳 পেমেন্ট':isWelcome?'🎉 স্বাগত':isDisconn?'🔴 সংযোগ বিচ্ছিন্ন':isReconn?'🟢 পুনঃসংযোগ':'📅 রিমাইন্ডার';
        return `<div style="padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="background:${typeColor}15;color:${typeColor};border:1px solid ${typeColor}25;border-radius:6px;padding:2px 10px;font-size:10.5px;font-weight:800">${typeLabel}</span>
            ${isPay&&log.amount?`<span style="font-family:'Exo 2',sans-serif;font-weight:900;font-size:16px;color:#34d399">৳${log.amount}</span>`:''}
          </div>
          <div style="background:rgba(99,102,241,0.06);border:1px solid rgba(99,102,241,0.1);border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:12px;color:#cbd5e1;line-height:1.8">${log.msg}</div>
          <div style="font-size:10px;color:#334155;margin-top:6px;text-align:right">✅ ${log.time}</div>
        </div>`;
      }).join('');

      s += fCard(safeId, smsHeader, smsMsgs, true);
    });
  }

  s+='</div>';
  return s;
}

// ছবি preview + base64 সেভ
function previewPhoto(input, previewId, varName){
  const file=input.files[0]; if(!file)return;
  // Canvas দিয়ে ছবি ছোট করা — localStorage-এ ধরার জন্য
  const img=new Image();
  const url=URL.createObjectURL(file);
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const MAX=200; // max 200x200 px
    let w=img.width, h=img.height;
    if(w>h){ if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} }
    else { if(h>MAX){w=Math.round(w*MAX/h);h=MAX;} }
    const canvas=document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    const b64=canvas.toDataURL('image/jpeg',0.75); // 75% quality JPEG
    if(varName==='_newPhotoB64') _newPhotoB64=b64;
    else if(varName==='_editPhotoB64') _editPhotoB64=b64;
    const prev=document.getElementById(previewId);
    if(prev) prev.innerHTML=`<img src="${b64}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit"/>`;
  };
  img.src=url;
}

  const pkgId=+document.getElementById('a-pkg').value;

    customPrice=parseInt(document.getElementById('a-custom-price').value)||0;
    if(!customPrice){toast('বিলের পরিমাণ লিখুন',true);return}
  }

  const c={id:Date.now(),name,phone,
    address:document.getElementById('a-addr').value.trim(),
    packageId:pkgId, customPrice:pkgId===5?customPrice:0,
    joinDate:new Date().toISOString().slice(0,10),
    status:'active',
    photo:_newPhotoB64||''};
  customers.push(c); sv('nb2_c',customers);

  addBillsFor(c);

  // পূর্বের বকেয়া বিল
  const total=window._prevDueCount||1;
  for(let i=0;i<total;i++){
    const mEl=document.getElementById('pd-month-'+i);
    const aEl=document.getElementById('pd-amt-'+i);
    if(!mEl||!aEl) continue;
    const m=mEl.value.trim(), a=parseInt(aEl.value)||0;
    if(m&&a>0){
      bills.push({id:Date.now()+i+Math.random(),customerId:c.id,customerName:c.name,phone:c.phone,
        month:m,monthKey:'prev-'+i+'-'+c.id,amount:a,paid:0,due:a,status:'unpaid',packageId:pkgId,isPrevDue:true});
    }
  }
  sv('nb2_b',bills);

  const now=new Date().toLocaleString('bn-BD');
  const welMsg=`সম্মানিত গ্রাহক ${name}, আপনাকে ধন্যবাদ ${company.name} এর সাথে সংযুক্ত হওয়ার জন্য। আপনার সেবায় আমরা সর্বদা প্রস্তুত। - ${company.name} (${company.phone})`;

  autoBackup(); closeSheet();

  render();
}

function confirmPay(){
  const amount=parseInt(document.getElementById('pay-inp').value);
  if(!amount||amount<=0){toast('সঠিক পরিমাণ লিখুন',true);return}
  const b=payBill;
  const idx=bills.findIndex(x=>x.id===b.id); if(idx===-1)return;
  const np=bills[idx].paid+amount, nd=Math.max(0,bills[idx].amount-np);
  bills[idx]={...bills[idx],paid:np,due:nd,status:nd===0?'paid':'partial'};
  sv('nb2_b',bills);
  const rem=Math.max(0,b.due-amount);
  const msg=rem>0
    ?`সম্মানিত গ্রাহক ${b.customerName}, আপনার ${b.month} মাসের ওয়াই ফাই বিল ৳${amount} পেমেন্ট হয়েছে। বাকি: ৳${rem}। ধন্যবাদ। - ${company.name} (${company.phone})`

  const log={id:Date.now(),type:'payment',phone:b.phone,name:b.customerName,from:company.phone,fromName:company.name,msg,time:new Date().toLocaleString('bn-BD'),amount,rem};

  render();          // ফোল্ডার আপডেট করো

}

  const active=customers.filter(c=>c.status==='active');
  const now=new Date().toLocaleString('bn-BD');

const GAS_SCRIPT_CODE = `function doPost(e){try{var data=e.postData.contents;var files=DriveApp.getFilesByName('NetBill_Backup.json');if(files.hasNext()){files.next().setContent(data);}else{DriveApp.createFile('NetBill_Backup.json',data,MimeType.PLAIN_TEXT);}return ContentService.createTextOutput(JSON.stringify({status:'ok',time:new Date().toISOString()})).setMimeType(ContentService.MimeType.JSON);}catch(err){return ContentService.createTextOutput(JSON.stringify({status:'error',msg:err.toString()})).setMimeType(ContentService.MimeType.JSON);}}
function doGet(e){try{var files=DriveApp.getFilesByName('NetBill_Backup.json');if(files.hasNext()){var content=files.next().getBlob().getDataAsString();return ContentService.createTextOutput(content).setMimeType(ContentService.MimeType.JSON);}return ContentService.createTextOutput(JSON.stringify({error:'backup_not_found'})).setMimeType(ContentService.MimeType.JSON);}catch(err){return ContentService.createTextOutput(JSON.stringify({error:err.toString()})).setMimeType(ContentService.MimeType.JSON);}}`;

function getGasUrl(){ return ld('nb2_gasurl',''); }

async function doBackup(){
  const url=getGasUrl();
  if(!url) return;
  const data={customers,bills,smsLog,company,backupTime:new Date().toISOString()};
  try{
    const r=await fetch(url,{method:'POST',body:JSON.stringify(data),headers:{'Content-Type':'text/plain'}});
    const res=await r.json();
    if(res.status==='ok'){
      const ts=new Date().toLocaleString('bn-BD');
      sv('nb2_lastbackup',ts);
      const el=document.getElementById('backup-status');
      if(el) el.innerHTML='✅ শেষ ব্যাকআপ: <strong>'+ts+'</strong>';
    }
  }catch(e){console.log('Backup failed:',e)}
}

async function restoreFromDrive(){
  const url=getGasUrl();
  if(!url){toast('আগে Google Drive সেটআপ করুন',true);return}
  toast('⏳ Drive থেকে ডেটা আনা হচ্ছে...');
  try{
    const r=await fetch(url);
    const data=await r.json();
    if(data.error){toast('Drive-এ ব্যাকআপ পাওয়া যায়নি',true);return}
    if(data.customers){customers=data.customers;sv('nb2_c',customers)}
    if(data.bills){bills=data.bills;sv('nb2_b',bills)}
    if(data.smsLog){smsLog=data.smsLog;sv('nb2_s',smsLog)}
    if(data.company){company=data.company;sv('nb2_co',company)}
    closeSheet(); toast('✅ Drive থেকে ডেটা পুনরুদ্ধার হয়েছে!'); render();
  }catch(e){toast('পুনরুদ্ধার ব্যর্থ — URL চেক করুন',true)}
}
